<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="815" viewBox="0 0 1400 815"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="815" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">A PQL function is two implementations that must agree</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">The reference implementation and the SQL are written together, and the suite runs both on the same</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">inputs, on every engine that claims the function.</text><rect id="box-fn" x="60" y="203.25" width="470" height="214" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="205.25" width="466" height="8" rx="3" fill="#2B3FA8"/><text id="t-fn-4" x="84" y="253.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Function(...)</text><text id="t-fn-5" x="84" y="283.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">name, summary, arity, argument_types,</text><text id="t-fn-6" x="84" y="309.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">returns; evaluate (the reference,</text><text id="t-fn-7" x="84" y="335.15000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">required); sql and sql_by_engine;</text><text id="t-fn-8" x="84" y="360.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">unsupported_on; requires;</text><text id="t-fn-9" x="84" y="386.45000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">excel_divergence</text><rect id="box-reg" x="600" y="203.25" width="740" height="137" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="602" y="205.25" width="736" height="8" rx="3" fill="#8A93AD"/><text id="t-reg-10" x="624" y="253.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">FunctionRegistry.register</text><text id="t-reg-11" x="624" y="283.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">refuses a volatile name (NOW, RAND): a control must replay.</text><text id="t-reg-12" x="624" y="309.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Registered by an explicit install(), never on import.</text><line id="a13" x1="534" y1="310.25" x2="594" y2="271.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-use0" x="60.0" y="477.25" width="400.0" height="137" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="479.25" width="396.0" height="8" rx="3" fill="#00B3A4"/><text id="t-use0-14" x="84.0" y="527.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Checker</text><text id="t-use0-15" x="84.0" y="557.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">arity and argument families, at</text><text id="t-use0-16" x="84.0" y="583.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama control check</text><rect id="box-use1" x="500.0" y="477.25" width="400.0" height="137" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="502.0" y="479.25" width="396.0" height="8" rx="3" fill="#2FB673"/><text id="t-use1-17" x="524.0" y="527.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Compiler</text><text id="t-use1-18" x="524.0" y="557.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">render(engine): the template for</text><text id="t-use1-19" x="524.0" y="583.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">that engine, or a refusal</text><rect id="box-use2" x="940.0" y="477.25" width="400.0" height="137" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="942.0" y="479.25" width="396.0" height="8" rx="3" fill="#E8B33A"/><text id="t-use2-20" x="964.0" y="527.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Reference interpreter</text><text id="t-use2-21" x="964.0" y="557.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">evaluate(arguments): exact</text><text id="t-use2-22" x="964.0" y="583.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Decimal arithmetic</text><line id="a23" x1="970.0" y1="344.25" x2="260.0" y2="471.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a24" x1="970.0" y1="344.25" x2="700.0" y2="471.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a25" x1="970.0" y1="344.25" x2="1140.0" y2="471.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-suite" x="60" y="650.25" width="1280" height="117" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-suite-26" x="84" y="682.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">tests/pql/test_function_catalogue.py executes the compiler&#x27;s SQL on DuckDB, SQLite and, with a DSN,</text><text id="t-suite-27" x="84" y="709.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">PostgreSQL, and compares it with evaluate on the same arguments. prama control functions prints what each</text><text id="t-suite-28" x="84" y="736.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">engine refuses.</text></svg>