<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="978" viewBox="0 0 1400 978"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="978" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">How an extension is found</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Three ways in, one rule: core code never names a concrete implementation. It asks a registry by</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">key, and the registry checks what it is given.</text><text id="t4" x="60" y="191.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#2B3FA8" text-anchor="start" xml:space="preserve">DISCOVERY</text><rect id="box-way0" x="60" y="207.25" width="400" height="189" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="209.25" width="396" height="8" rx="3" fill="#00B3A4"/><text id="t-way0-5" x="84" y="257.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Entry point</text><text id="t-way0-6" x="84" y="287.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">A distribution advertises it</text><text id="t-way0-7" x="84" y="313.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">(prama.validators,</text><text id="t-way0-8" x="84" y="339.15000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama.delegates); loaded at</text><text id="t-way0-9" x="84" y="364.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">start, vetted before use.</text><rect id="box-way1" x="60" y="414.25" width="400" height="189" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="416.25" width="396" height="8" rx="3" fill="#2FB673"/><text id="t-way1-10" x="84" y="464.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Table in its package</text><text id="t-way1-11" x="84" y="494.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">One mapping in the owning</text><text id="t-way1-12" x="84" y="520.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">package: BUILTIN connectors,</text><text id="t-way1-13" x="84" y="546.15" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">DIALECTS, IMPORTERS, KINDS,</text><text id="t-way1-14" x="84" y="571.8000000000001" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">_BY_ENGINE.</text><rect id="box-way2" x="60" y="621.25" width="400" height="189" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="623.25" width="396" height="8" rx="3" fill="#8CBF3F"/><text id="t-way2-15" x="84" y="671.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Explicit install</text><text id="t-way2-16" x="84" y="701.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">install(registry), called from</text><text id="t-way2-17" x="84" y="727.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the CLI entry point and</text><text id="t-way2-18" x="84" y="753.15" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">create_app, never as a side</text><text id="t-way2-19" x="84" y="778.8000000000001" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">effect of an import.</text><text id="t20" x="540" y="191.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#2B3FA8" text-anchor="start" xml:space="preserve">REGISTRATION</text><rect id="box-registry" x="540" y="401.75" width="360" height="214" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="542" y="403.75" width="356" height="8" rx="3" fill="#2B3FA8"/><text id="t-registry-21" x="564" y="451.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Registry</text><text id="t-registry-22" x="564" y="482.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Checks the class subclasses</text><text id="t-registry-23" x="564" y="508.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the base, its manifest&#x27;s kind</text><text id="t-registry-24" x="564" y="533.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">and key, and refuses a</text><text id="t-registry-25" x="564" y="559.3000000000001" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">duplicate key. An ill-formed</text><text id="t-registry-26" x="564" y="584.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">plugin fails here, by name.</text><line id="a27" x1="464" y1="301.75" x2="534" y2="508.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a28" x1="464" y1="508.75" x2="534" y2="508.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a29" x1="464" y1="715.75" x2="534" y2="508.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><text id="t30" x="960" y="191.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#2B3FA8" text-anchor="start" xml:space="preserve">PROOF</text><rect id="box-proof" x="960" y="401.75" width="380" height="214" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="962" y="403.75" width="376" height="8" rx="3" fill="#E8B33A"/><text id="t-proof-31" x="984" y="451.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Conformance</text><text id="t-proof-32" x="984" y="482.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Each kind has a suite: the</text><text id="t-proof-33" x="984" y="508.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">connector contract, function</text><text id="t-proof-34" x="984" y="533.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">agreement on real engines, the</text><text id="t-proof-35" x="984" y="559.3000000000001" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">delegate kit, the lease</text><text id="t-proof-36" x="984" y="584.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">contract.</text><line id="a37" x1="904" y1="508.75" x2="954" y2="508.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-rule" x="60" y="840.25" width="1280" height="90" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-rule-38" x="84" y="872.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">A plugin&#x27;s manifest says what it is and what it can do (Capability); the compiler consults capabilities and</text><text id="t-rule-39" x="84" y="899.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">never probes. The verification field says whether it has met the real thing or is code-complete only.</text></svg>