cope) authenticates and checks the</text><text id="t-api-21" x="412" y="525.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">scope</text><line id="a22" x1="207.5" y1="315.25" x2="207.5" y2="377.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a23" x1="535.5" y1="315.25" x2="535.5" y2="377.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a24" x1="863.5" y1="315.25" x2="863.5" y2="377.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-svc" x="60" y="603.25" width="1280" height="130" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="605.25" width="1276" height="8" rx="3" fill="#8A93AD"/><text id="t-svc-25" x="84" y="655.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Services: shared domain operations</text><text id="t-svc-26" x="84" y="688.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama.semantic.services, prama.controls.language / proposals / runs, prama.evidence.service,</text><text id="t-svc-27" x="84" y="717.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama.recon.service. Some routes call a DAO directly.</text><line id="a28" x1="207.5" y1="535.25" x2="207.5" y2="597.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a29" x1="699.5" y1="535.25" x2="699.5" y2="597.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a30" x1="1191.5" y1="315.25" x2="1191.5" y2="597.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-uow" x="60" y="793.25" width="820" height="150" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="7