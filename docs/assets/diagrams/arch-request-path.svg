-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Jinja pages, session</text><text id="t-e0-6" x="84" y="297.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">cookie</text><rect id="box-e1" x="388" y="183.25" width="295" height="130" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="390" y="185.25" width="291" height="8" rx="3" fill="#2B3FA8"/><text id="t-e1-7" x="412" y="235.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">SDK</text><text id="t-e1-8" x="412" y="268.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama_sdk.Client over</text><text id="t-e1-9" x="412" y="297.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">httpx</text><rect id="box-e2" x="716" y="183.25" width="295" height="130" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="718" y="185.25" width="291" height="8" rx="3" fill="#2B3FA8"/><text id="t-e2-10" x="740" y="235.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Any HTTP client</text><text id="t-e2-11" x="740" y="268.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">X-Prama-API-Key or</text><text id="t-e2-12" x="740" y="297.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Bearer</text><rect id="box-e3" x="1044" y="183.25" width="295" height="130" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="1046" y="185.25" width="291" height="8" rx=