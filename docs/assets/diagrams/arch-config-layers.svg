<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1197" viewBox="0 0 1400 1197"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="1197" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Configuration: five layers, the later one wins</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama.core.config.load_configuration. A secret belongs only in the git-ignored overlay, and the</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">shipped session secret is empty so a fresh clone refuses to boot.</text><rect id="box-p0" x="60" y="183.25" width="460" height="127" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="185.25" width="456" height="8" rx="3" fill="#8A93AD"/><text id="t-p0-4" x="84" y="233.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Defaults</text><text id="t-p0-5" x="84" y="265.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Every key, with its default.</text><rect id="box-pc0" x="550" y="183.25" width="790" height="127" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc0-6" x="570" y="213.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama.core.config.defaults</text><line id="a7" x1="522" y1="246.75" x2="546" y2="246.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a8" x1="290.0" y1="312.25" x2="290.0" y2="346.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p1" x="60" y="350.25" width="460" height="127" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="352.25" width="456" height="8" rx="3" fill="#0E1A46"/><text id="t-p1-9" x="84" y="400.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">The tracked file</text><text id="t-p1-10" x="84" y="432.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Reviewable; no secret allowed.</text><rect id="box-pc1" x="550" y="350.25" width="790" height="127" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc1-11" x="570" y="380.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">config/application.yaml</text><line id="a12" x1="522" y1="413.75" x2="546" y2="413.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a13" x1="290.0" y1="479.25" x2="290.0" y2="513.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p2" x="60" y="517.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="519.25" width="456" height="8" rx="3" fill="#D9534F"/><text id="t-p2-14" x="84" y="567.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">The local overlay</text><text id="t-p2-15" x="84" y="599.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Git-ignored; where a real secret</text><text id="t-p2-16" x="84" y="628.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">goes.</text><rect id="box-pc2" x="550" y="517.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc2-17" x="570" y="547.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">config/application.local.yaml</text><line id="a18" x1="522" y1="594.75" x2="546" y2="594.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a19" x1="290.0" y1="674.25" x2="290.0" y2="708.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p3" x="60" y="712.25" width="460" height="127" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="714.25" width="456" height="8" rx="3" fill="#2B3FA8"/><text id="t-p3-20" x="84" y="762.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">The environment</text><text id="t-p3-21" x="84" y="794.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">PRAMA_ prefix, __ between levels.</text><rect id="box-pc3" x="550" y="712.25" width="790" height="127" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc3-22" x="570" y="742.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">PRAMA_DATABASE__POOL__SIZE=20</text><line id="a23" x1="522" y1="775.75" x2="546" y2="775.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a24" x1="290.0" y1="841.25" x2="290.0" y2="875.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p4" x="60" y="879.25" width="460" height="127" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="881.25" width="456" height="8" rx="3" fill="#00B3A4"/><text id="t-p4-25" x="84" y="929.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">The command line</text><text id="t-p4-26" x="84" y="961.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">One invocation only.</text><rect id="box-pc4" x="550" y="879.25" width="790" height="127" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc4-27" x="570" y="909.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">--set key=value</text><line id="a28" x1="522" y1="942.75" x2="546" y2="942.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><rect id="box-n" x="60" y="1046.25" width="1280" height="103" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-n-29" x="84" y="1081.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">${VAR:default} placeholders are resolved, nested ones included; an unresolved one is an error, not a</text><text id="t-n-30" x="84" y="1109.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">literal. prama config show prints the merged result with secrets redacted.</text></svg>