eight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">agent imports</text><line id="a14" x1="422" y1="253.25" x2="446" y2="253.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a15" x1="1012" y1="293.25" x2="1066" y2="293.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-list" x="60" y="443.25" width="1280" height="250" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-list-16" x="80" y="472.25" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama.core.{errors, clock, calendars, log, pjson} → prama_kernel.{same}</text><text id="t-list-17" x="80" y="495.25" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama.ir.model → prama_kernel.plan</text><text id="t-list-18" x="80" y="518.25" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama.backend.execute → prama_kernel.judge</text><text id="t-list-19" x="80" y="541.25" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama.evidence.record → prama_kernel.record</text><text id="t-list-20" x="80" y="564.25" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama.recon.{engine, match, normalise, classify, nway, pql} → prama_kernel.recon.*</text><text id="t-list-21" x="80" y="587.25" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama.delegates.{spi, registry, host, sandbox, worker} → prama_kernel.delegates.*</text><text id="t-list-22" x="80" y="610.25" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama.agent.{protocol, capability, residency, spool} → prama_kernel.agent.*</text><text id="t-list-23" x="80" y="633.25" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama.semantic.relationships, prama.classify.plugins, prama.packs.banking.{calendars, holidays} → their kernel</text><text id="t-list-24" x="80" y="656.2" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">modules</text><rect id="box-id" x="60" y="733.25" width="1280" height="103" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-id-25" x="84" y="768.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">test_the_server_aliases_are_the_kernel_modules asserts identity (is), not equality: prama.core.errors is</text><text id="t-id-26" x="84" y="796.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama_kernel.errors. A copy would pass an equality test and drift on the first fix.</text></svg>