<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="540" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">An importer reports three things, and never guesses</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">What came across exactly, what came across with a caveat, and what did not come across, each named.</text><rect id="box-imp0" x="60.0" y="172.2" width="290.0" height="190" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="174.2" width="286.0" height="8" rx="3" fill="#8A93AD"/><text id="t-imp0-3" x="84.0" y="220.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">The other tool&#x27;s</text><text id="t-imp0-4" x="84.0" y="249.89999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">file</text><text id="t-imp0-5" x="84.0" y="279.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">dbt schema.yml,</text><text id="t-imp0-6" x="84.0" y="305.34999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">SodaCL, a GX suite, a</text><text id="t-imp0-7" x="84.0" y="331.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">rules sheet</text><rect id="box-imp1" x="390.0" y="172.2" width="290.0" height="190" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="392.0" y="174.2" width="286.0" height="8" rx="3" fill="#00B3A4"/><text id="t-imp1-8" x="414.0" y="220.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">read_text</text><text id="t-imp1-9" x="414.0" y="250.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">_parse(text) into a</text><text id="t-imp1-10" x="414.0" y="275.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">document, then</text><text id="t-imp1-11" x="414.0" y="301.3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">read(document)</text><line id="a12" x1="354.0" y1="267.2" x2="384.0" y2="267.2" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-imp2" x="720.0" y="172.2" width="290.0" height="190" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="722.0" y="174.2" width="286.0" height="8" rx="3" fill="#2B3FA8"/><text id="t-imp2-13" x="744.0" y="220.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Collector</text><text id="t-imp2-14" x="744.0" y="250.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">control(pql, caveat=…)</text><text id="t-imp2-15" x="744.0" y="275.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">or unmapped(source,</text><text id="t-imp2-16" x="744.0" y="301.3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">reason, remedy)</text><line id="a17" x1="684.0" y1="267.2" x2="714.0" y2="267.2" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-imp3" x="1050.0" y="172.2" width="290.0" height="190" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="1052.0" y="174.2" width="286.0" height="8" rx="3" fill="#E8B33A"/><text id="t-imp3-18" x="1074.0" y="220.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">ImportResult</text><text id="t-imp3-19" x="1074.0" y="250.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">controls, caveats,</text><text id="t-imp3-20" x="1074.0" y="275.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">unmapped; render() for</text><text id="t-imp3-21" x="1074.0" y="301.3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the reviewer</text><line id="a22" x1="1014.0" y1="267.2" x2="1044.0" y2="267.2" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-coll" x="60" y="402.2" width="1280" height="90" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-coll-23" x="84" y="434.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">Collector.control parses the PQL; an expression that does not parse becomes an unmapped entry rather than</text><text id="t-coll-24" x="84" y="461.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">aborting the migration. Every control carries a BECAUSE naming its origin, built by because(origin).</text></svg>