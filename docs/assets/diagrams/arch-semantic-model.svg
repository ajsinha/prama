space="preserve">Dataset</text><text id="t-m0-5" x="84.0" y="268.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">sem_dataset_version: grain,</text><text id="t-m0-6" x="84.0" y="297.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">business key, rhythm,</text><text id="t-m0-7" x="84.0" y="325.34999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">criticality 1-4, temporality,</text><text id="t-m0-8" x="84.0" y="353.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">authoritativeness, owner,</text><text id="t-m0-9" x="84.0" y="382.04999999999995" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">steward, business context</text><rect id="box-m1" x="496.6666666666667" y="183.25" width="406.6666666666667" height="268" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="498.6666666666667" y="185.25" width="402.6666666666667" height="8" rx="3" fill="#0E1A46"/><text id="t-m1-10" x="520.6666666666667" y="235.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Attribute</text><text id="t-m1-11" x="520.6666666666667" y="268.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">sem_attribute_version:</text><text id="t-m1-12" x="520.6666666666667" y="297.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">definition, semantic type,</text><text id="t-m1-13" x="520.6