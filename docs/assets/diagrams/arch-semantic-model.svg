id="t-m2-21" x="957.3333333333334" y="382.04999999999995" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">tolerance, status proposed or</text><text id="t-m2-22" x="957.3333333333334" y="410.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">confirmed</text><rect id="box-m3" x="60.0" y="481.25" width="406.6666666666667" height="212" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="483.25" width="402.6666666666667" height="8" rx="3" fill="#2B3FA8"/><text id="t-m3-23" x="84.0" y="533.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Concepts, journeys</text><text id="t-m3-24" x="84.0" y="566.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">sem_concept,</text><text id="t-m3-25" x="84.0" y="595.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">sem_concept_property,</text><text id="t-m3-26" x="84.0" y="623.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">sem_journey, sem_domain: the</text><text id="t-m3-27" x="84.0" y="651.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">shared vocabulary and the map</text><rect id="box-m4" x="496.6666666666667" y="481.25" width="406.6666666666667" height="212" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="498.6666666666667" y="483.25" width="402.6666666666667" height="8" rx="3" fill="#00B3A4"/><text id="t-m4-28" x="520.6666666666667" y="533.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Connection and binding</text><text id="t-m4-29" x="520.6666666666667" y="566.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">sem_connection, sem_binding:</text><text id="t-m4-30" x="520.6666666666667" y="595.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">where a declared dataset</text><text id="t-m4-31" x="520.6666666666667" y="623.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">physically is, by a connector</text><text id="t-m4-32" x="520.6666666666667" y="651.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the business configured</text><rect id="box-m5" x="933.3333333333334" y="481.25" width="406.6666666666667" height="212" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="935.3333333333334" y="483.25" width="402.6666666666667" height="8" rx="3" fill="#E8B33A"/><text id="t-m5-33" x="957.3333333333334" y="533.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Metadata and glossary</text><text id="t-m5-34" x="957.3333333333334" y="566.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">md_template, md_field,</text><text id="t-m5-35" x="957.3333333333334" y="595.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">md_value; gl_term, gl_binding.</text><text id="t-m5-36" x="957.3333333333334" y="623.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">A metadata field may carry a</text><text id="t-m5-37" x="957.3333333333334" y="651.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">rule</text><rect id="box-gamma" x="60" y="743.25" width="600" height="170" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="745.25" width="596" height="8" rx="3" fill="#2FB673"/><text id="t-gamma-38" x="84" y="795.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">prama.derive.ControlGenerator (Γ)</text><text id="t-gamma-39" x="84" y="828.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">grain → uniqueness; rhythm → freshness and</text><text id="t-gamma-40" x="84" y="857.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">volume; value domain → membership;</text><text id="t-gamma-41" x="84" y="885.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">relationship → RelationshipGenerator</text><rect id="box-policy" x="740" y="743.25" width="600" height="170" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="742" y="745.25" width="596" height="8" rx="3" fill="#D9534F"/><text id="t-policy-42" x="764" y="795.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">prama.semantic.policy.ApprovalPolicy</text><text id="t-policy-43" x="764" y="828.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">tier 1: maker-checker; tier 2: review; tiers 3</text><text id="t-policy-44" x="764" y="857.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">and 4: none. An author cannot approve their</text><text id="t-policy-45" x="764" y="885.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">own Tier-1 declaration</text><line id="a46" x1="360" y1="697.25" x2="360" y2="737.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a47" x1="1040" y1="697.25" x2="1040" y2="737.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/></svg>