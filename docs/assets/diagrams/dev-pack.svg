<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="746" viewBox="0 0 1400 746"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="746" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">A pack contributes to the core, and adds no mechanism</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Everything a pack ships lands in a registry the core already has, installed explicitly at start.</text><rect id="box-pack" x="60" y="182.2" width="380" height="214" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="184.2" width="376" height="8" rx="3" fill="#2B3FA8"/><text id="t-pack-3" x="84" y="232.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">prama.packs.&lt;domain&gt;</text><text id="t-pack-4" x="84" y="262.79999999999995" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">functions, calendars, concepts,</text><text id="t-pack-5" x="84" y="288.44999999999993" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">reconciliation templates,</text><text id="t-pack-6" x="84" y="314.09999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">obligations, message readers,</text><text id="t-pack-7" x="84" y="339.74999999999994" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">and a readout of what it does</text><text id="t-pack-8" x="84" y="365.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">not claim</text><rect id="box-tgt0" x="530" y="182.2" width="810" height="108" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="532" y="184.2" width="806" height="8" rx="3" fill="#00B3A4"/><text id="t-tgt0-9" x="554" y="230.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">PQL function registry</text><text id="t-tgt0-10" x="554" y="259.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">crossfield.install: IBAN_BIC_CONSISTENT and friends</text><line id="a11" x1="444" y1="289.2" x2="524" y2="236.2" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-tgt1" x="530" y="314.2" width="810" height="108" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="532" y="316.2" width="806" height="8" rx="3" fill="#2FB673"/><text id="t-tgt1-12" x="554" y="362.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Calendar registry</text><text id="t-tgt1-13" x="554" y="391.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">TARGET2, FederalReserve, London, NYSE, from rules</text><line id="a14" x1="444" y1="289.2" x2="524" y2="368.2" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-tgt2" x="530" y="446.2" width="810" height="108" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="532" y="448.2" width="806" height="8" rx="3" fill="#E8B33A"/><text id="t-tgt2-15" x="554" y="494.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Readouts</text><text id="t-tgt2-16" x="554" y="523.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama pack … and /api/v1/packs/banking</text><line id="a17" x1="444" y1="289.2" x2="524" y2="500.2" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-once" x="60" y="608.2" width="1280" height="90" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-once-18" x="84" y="640.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">install_shipped() in prama.packs runs once, from the CLI entry point and from create_app. A function that</text><text id="t-once-19" x="84" y="667.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">exists because a module happened to be imported compiles in one process and is refused in another.</text></svg>