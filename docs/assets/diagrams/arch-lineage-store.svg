<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1189" viewBox="0 0 1400 1189"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="1189" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Lineage: many readers, one store, every edge says how it is known</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Parsers read code and never run it. A model may suggest an edge; it is stored as inferred until a</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">person confirms it.</text><rect id="box-src0" x="60.0" y="183.25" width="625.0" height="183" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="185.25" width="621.0" height="8" rx="3" fill="#0E1A46"/><text id="t-src0-4" x="84.0" y="235.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">SQL</text><text id="t-src0-5" x="84.0" y="268.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">lineage.parsed (sqlglot, ~20 dialects);</text><text id="t-src0-6" x="84.0" y="297.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">lineage.sql regex fallback leaves a</text><text id="t-src0-7" x="84.0" y="325.34999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">regex_fallback gap</text><rect id="box-src1" x="715.0" y="183.25" width="625.0" height="183" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="717.0" y="185.25" width="621.0" height="8" rx="3" fill="#0E1A46"/><text id="t-src1-8" x="739.0" y="235.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Code</text><text id="t-src1-9" x="739.0" y="268.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">lineage.pyspark, pandas_ast, airflow, powerbi;</text><text id="t-src1-10" x="739.0" y="297.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">lineage.scan for T-SQL, PL/SQL, SSIS, PowerCenter</text><rect id="box-src2" x="60.0" y="396.25" width="625.0" height="183" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="398.25" width="621.0" height="8" rx="3" fill="#2B3FA8"/><text id="t-src2-11" x="84.0" y="448.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Events and history</text><text id="t-src2-12" x="84.0" y="481.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">lineage.ingest (OpenLineage, dbt manifest);</text><text id="t-src2-13" x="84.0" y="510.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">lineage.history (Snowflake, Databricks, BigQuery</text><text id="t-src2-14" x="84.0" y="538.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">exports)</text><rect id="box-src3" x="715.0" y="396.25" width="625.0" height="183" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="717.0" y="398.25" width="621.0" height="8" rx="3" fill="#2B3FA8"/><text id="t-src3-15" x="739.0" y="448.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Other catalogues</text><text id="t-src3-16" x="739.0" y="481.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">importers.catalog: Manta and Alation lineage,</text><text id="t-src3-17" x="739.0" y="510.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">kept beside Prama&#x27;s own parse</text><rect id="box-store" x="60" y="629.25" width="1280" height="150" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="631.25" width="1276" height="8" rx="3" fill="#00B3A4"/><text id="t-store-18" x="84" y="681.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">lin_source, lin_run, lin_edge, lin_gap</text><text id="t-store-19" x="84" y="714.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">lineage.store.scan_sql records each run; an edge is parsed (1.0), inferred (0.8, or a model&#x27;s ≤ 0.85) or</text><text id="t-store-20" x="84" y="743.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">confirmed by a person; gaps are stored, not hidden</text><line id="a21" x1="370" y1="583.25" x2="370" y2="623.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a22" x1="1030" y1="583.25" x2="1030" y2="623.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-use0" x="60.0" y="829.25" width="625.0" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="831.25" width="621.0" height="8" rx="3" fill="#E8B33A"/><text id="t-use0-23" x="84.0" y="881.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Impact</text><text id="t-use0-24" x="84.0" y="914.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">graph.LineageGraph.blast_radius; prama lineage</text><text id="t-use0-25" x="84.0" y="943.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">impact</text><rect id="box-use1" x="715.0" y="829.25" width="625.0" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="717.0" y="831.25" width="621.0" height="8" rx="3" fill="#E8B33A"/><text id="t-use1-26" x="739.0" y="881.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Change gate</text><text id="t-use1-27" x="739.0" y="914.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">lineage.change.assess; exit 3 when a control is</text><text 