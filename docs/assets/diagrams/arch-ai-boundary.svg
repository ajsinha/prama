<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="761" viewBox="0 0 1400 761"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="761" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">AI never adjudicates: where the line is, and what holds it</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Model output is text. It becomes a control only through the same validator and the same person as</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">anything else, and no verdict code can reach a model.</text><rect id="box-may" x="60" y="183.25" width="400" height="330" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="185.25" width="396" height="8" rx="3" fill="#E8B33A"/><text id="t-may-4" x="84" y="235.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">May reach prama.llm</text><text id="t-may-5" x="84" y="268.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">assistant (read and propose</text><text id="t-may-6" x="84" y="297.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">tools), induce.llm, the</text><text id="t-may-7" x="84" y="325.34999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">stewards,</text><text id="t-may-8" x="84" y="353.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">codeintake.model_lineage,</text><text id="t-may-9" x="84" y="382.04999999999995" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">metadata ask, curation</text><text id="t-may-10" x="84" y="410.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">drafts. They author, rank,</text><text id="t-may-11" x="84" y="438.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">explain and summarise.</text><rect id="box-val" x="500" y="183.25" width="400" height="330" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="502" y="185.25" width="396" height="8" rx="3" fill="#2B3FA8"/><text id="t-val-12" x="524" y="235.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">induce.validate.Validator</text><text id="t-val-13" x="524" y="268.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">PARSE → TYPE_CHECK → COMPILE</text><text id="t-val-14" x="524" y="297.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">→ SANDBOX → COUNTERFACTUAL.</text><text id="t-val-15" x="524" y="325.34999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Validated cannot be</text><text id="t-val-16" x="524" y="353.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">constructed unless every gate</text><text id="t-val-17" x="524" y="382.04999999999995" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">passed. Then the proposal</text><text id="t-val-18" x="524" y="410.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">queue, origin induction, and</text><text id="t-val-19" x="524" y="438.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">a person.</text><rect id="box-never" x="940" y="183.25" width="400" height="330" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="942" y="185.25" width="396" height="8" rx="3" fill="#2FB673"/><text id="t-never-20" x="964" y="235.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Must never reach it</text><text id="t-never-21" x="964" y="268.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama.backend, prama.execute,</text><text id="t-never-22" x="964" y="297.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama.evidence, prama.ir: the</text><text id="t-never-23" x="964" y="325.34999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">compiler, the run, the</text><text id="t-never-24" x="964" y="353.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">judge&#x27;s caller and the</text><text id="t-never-25" x="964" y="382.04999999999995" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">ledger. They decide.</text><line id="a26" x1="462" y1="348.25" x2="496" y2="348.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-tests" x="60" y="563.25" width="1280" height="150" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-tests-27" x="80" y="592.25" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">tests/architecture/test_verdicts_cannot_reach_a_model.py import graph: no path</text><text id="t-tests-28" x="80" y="615.25" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">tests/architecture/test_layering.py::TestModelVerdicts no file both calls a model and names a verdict</text><text id="t-tests-29" x="80" y="638.25" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">tests/steward/test_stewards.py a steward never calls approve, sign, activate …</text><text id="t-tests-30" x="80" y="661.25" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">tests/assistant/test_injection.py no registered tool can mutate</text></svg>