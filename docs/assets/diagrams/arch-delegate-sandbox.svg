text><text id="t-p1-14" x="84" y="517.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">(10,000).</text><rect id="box-pc1" x="550" y="406.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc1-15" x="570" y="436.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">DelegateHost.measure_stream(plan, batches)</text><line id="a16" x1="522" y1="483.75" x2="546" y2="483.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a17" x1="290.0" y1="563.25" x2="290.0" y2="597.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p2" x="60" y="601.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="603.25" width="456" height="8" rx="3" fill="#E8B33A"/><text id="t-p2-18" x="84" y="651.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Isolate</text><text id="t-p2-19" x="84" y="683.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">A new interpreter, no network where</text><text id="t-p2-20" x="84" y="712.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the host allows it.</text><rect id="box-pc2" x="550" y="601.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc2-21" x="570" y="631.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">python -m prama_kernel.delegates.worker</text><text id="t-pc2-22" x="570" y="655.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">unshare --net --map-root-user</text><text id="t-pc2-23" x="570" y="679.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">RLIMIT_CPU, RLIMIT_AS 2048 MB, NOFILE 256, CORE 0</text><line id="a24" x1="522" y1="678.75" x2="546" y2="678.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a25" x1="290.0" y1="758.25" x2="290.0" y2="792.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p3" x="60" y="796.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="798.25" width="456" height="8" rx="3" fill="#E8B33A"/><text id="t-p3-26" x="84" y="846.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Seal</text><text id="t-p3-27" x="84" y="878.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">An audit hook refuses sockets,</text><text id="t-p3-28" x="84" y="907.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">subprocesses and exec.</text><rect id="box-pc3" x="550" y="796.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc3-29" x="570" y="826.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">worker.seal → sys.addaudithook</text><line id="a30" x1="522" y1="873.75" x2="546" y2="873.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a31" x1="290.0" y1="953.25" x2="290.0" y2="987.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p4" x="60" y="991.25" width="460" height="155" rx="14" fill="#FFF