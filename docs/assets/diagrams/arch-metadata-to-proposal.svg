<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1198" viewBox="0 0 1400 1198"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="1198" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">From a metadata value to a proposed control</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Setting mandatory=yes on a column proposes its check. Nothing runs until a person accepts it, and</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">setting it back retracts the proposal.</text><rect id="box-p0" x="60" y="183.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="185.25" width="456" height="8" rx="3" fill="#0E1A46"/><text id="t-p0-4" x="84" y="233.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Set a value</text><text id="t-p0-5" x="84" y="265.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama metadata set</text><text id="t-p0-6" x="84" y="294.20000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">trades.account_id mandatory=yes</text><rect id="box-pc0" x="550" y="183.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc0-7" x="570" y="213.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">semantic.services.metadata.set_values</text><text id="t-pc0-8" x="570" y="237.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">md_value row, coerced to the field kind</text><line id="a9" x1="522" y1="260.75" x2="546" y2="260.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a10" x1="290.0" y1="340.25" x2="290.0" y2="374.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p1" x="60" y="378.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="380.25" width="456" height="8" rx="3" fill="#2B3FA8"/><text id="t-p1-11" x="84" y="428.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Render the field&#x27;s rule</text><text id="t-p1-12" x="84" y="460.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Values enter only as literals:</text><text id="t-p1-13" x="84" y="489.20000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">metadata cannot inject PQL.</text><rect id="box-pc1" x="550" y="378.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc1-14" x="570" y="408.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">semantic.metadata.render</text><text id="t-pc1-15" x="570" y="432.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">pql: CHECK {{ dataset }}.{{ attribute }} IS NOT NULL</text><line id="a16" x1="522" y1="455.75" x2="546" y2="455.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a17" x1="290.0" y1="535.25" x2="290.0" y2="569.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p2" x="60" y="573.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="575.25" width="456" height="8" rx="3" fill="#2B3FA8"/><text id="t-p2-18" x="84" y="623.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Parse and identify</text><text id="t-p2-19" x="84" y="655.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">A stable identity, so a re-render</text><text id="t-p2-20" x="84" y="684.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">amends, never duplicates.</text><rect id="box-pc2" x="550" y="573.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc2-21" x="570" y="603.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">pql.parse_control</text><text id="t-pc2-22" x="570" y="627.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">identity = metadata-&lt;sha256(row, target, index)&gt;</text><line id="a23" x1="522" y1="650.75" x2="546" y2="650.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a24" x1="290.0" y1="730.25" x2="290.0" y2="764.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p3" x="60" y="768.25" width="460" height="187" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="770.25" width="456" height="8" rx="3" fill="#00B3A4"/><text id="t-p3-25" x="84" y="818.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Queue with every other</text><text id="t-p3-26" x="84" y="850.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">source</text><text id="t-p3-27" x="84" y="883.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Γ, lineage, metadata and</text><text id="t-p3-28" x="84" y="911.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">correlation, merged.</text><rect id="box-pc3" x="550" y="768.25" width="790" height="187" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc3-29" x="570" y="798.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">controls.proposals.queue()</text><text id="t-pc3-30" x="570" y="822.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">skips what is live or was rejected</text><line id="a31" x1="522" y1="861.75" x2="546" y2="861.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a32" x1="290.0" y1="957.25" x2="290.0" y2="991.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p4" x="60" y="995.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="997.25" width="456" height="8" rx="3" fill="#2FB673"/><text id="t-p4-33" x="84" y="1045.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">A person decides</text><text id="t-p4-34" x="84" y="1077.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Accept activates; reject is</text><text id="t-p4-35" x="84" y="1106.1999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">remembered with a reason.</text><rect id="box-pc4" x="550" y="995.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc4-36" x="570" y="1025.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">controls.proposals.accept → ControlDao.activate</text><text id="t-pc4-37" x="570" y="1049.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">controls.proposals.reject → ctl_rejection</text><line id="a38" x1="522" y1="1072.75" x2="546" y2="1072.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/></svg>