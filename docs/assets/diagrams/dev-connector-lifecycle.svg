<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="858" viewBox="0 0 1400 858"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="858" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">A connector&#x27;s life, from a form to a verdict</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Configure, verify, discover, pin, read. Each step is a method on your class, and each failure names</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">who has to fix it.</text><rect id="box-step0" x="60.0" y="203.25" width="232.0" height="237" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="205.25" width="228.0" height="8" rx="3" fill="#00B3A4"/><text id="t-step0-4" x="84.0" y="252.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Configure</text><text id="t-step0-5" x="84.0" y="281.45" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">registry.create(key,</text><text id="t-step0-6" x="84.0" y="305.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">config): the form</text><text id="t-step0-7" x="84.0" y="330.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">validates before</text><text id="t-step0-8" x="84.0" y="354.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">any driver runs</text><rect id="box-step1" x="322.0" y="203.25" width="232.0" height="237" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="324.0" y="205.25" width="228.0" height="8" rx="3" fill="#2FB673"/><text id="t-step1-9" x="346.0" y="252.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Verify</text><text id="t-step1-10" x="346.0" y="281.45" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">health(): healthy,</text><text id="t-step1-11" x="346.0" y="305.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">unreachable,</text><text id="t-step1-12" x="346.0" y="330.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">unauthorised or</text><text id="t-step1-13" x="346.0" y="354.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">misconfigured</text><line id="a14" x1="296.0" y1="321.75" x2="316.0" y2="321.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-step2" x="584.0" y="203.25" width="232.0" height="237" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="586.0" y="205.25" width="228.0" height="8" rx="3" fill="#8CBF3F"/><text id="t-step2-15" x="608.0" y="252.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Discover</text><text id="t-step2-16" x="608.0" y="281.45" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">discover() ranks</text><text id="t-step2-17" x="608.0" y="305.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">objects;</text><text id="t-step2-18" x="608.0" y="330.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">describe(path)</text><text id="t-step2-19" x="608.0" y="354.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">gives the columns</text><line id="a20" x1="558.0" y1="321.75" x2="578.0" y2="321.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-step3" x="846.0" y="203.25" width="232.0" height="237" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="848.0" y="205.25" width="228.0" height="8" rx="3" fill="#E8B33A"/><text id="t-step3-21" x="870.0" y="252.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Pin</text><text id="t-step3-22" x="870.0" y="281.45" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">snapshot(path)</text><text id="t-step3-23" x="870.0" y="305.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">names the exact</text><text id="t-step3-24" x="870.0" y="330.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">state read; exact</text><text id="t-step3-25" x="870.0" y="354.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">or not, it says so</text><line id="a26" x1="820.0" y1="321.75" x2="840.0" y2="321.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-step4" x="1108.0" y="203.25" width="232.0" height="237" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="1110.0" y="205.25" width="228.0" height="8" rx="3" fill="#E8823A"/><text id="t-step4-27" x="1132.0" y="252.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Read or</text><text id="t-step4-28" x="1132.0" y="283.3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">sample</text><text id="t-step4-29" x="1132.0" y="312.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">read(path,</text><text id="t-step4-30" x="1132.0" y="336.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">plan=SamplePlan)</text><text id="t-step4-31" x="1132.0" y="361.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">yields Arrow; a</text><text id="t-step4-32" x="1132.0" y="385.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">HEAD sample is a</text><text id="t-step4-33" x="1132.0" y="409.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">preview</text><line id="a34" x1="1082.0" y1="321.75" x2="1102.0" y2="321.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-local" x="60" y="490.25" width="620.0" height="163" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="492.25" width="616.0" height="8" rx="3" fill="#8A93AD"/><text id="t-local-35" x="84" y="540.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">No query engine (the default)</text><text id="t-local-36" x="84" y="570.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">can_run_controls is False: the control is evaluated</text><text id="t-local-37" x="84" y="596.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">locally over the Arrow batches read() yields.</text><text id="t-local-38" x="84" y="622.15" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Correct, and the cost is shown to the author.</text><rect id="box-push" x="720.0" y="490.25" width="620.0" height="163" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="722.0" y="492.25" width="616.0" height="8" rx="3" fill="#2B3FA8"/><text id="t-push-39" x="744.0" y="540.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">A source with an engine</text><text id="t-push-40" x="744.0" y="570.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">can_run_controls is True: run_metric_query(sql) runs</text><text id="t-push-41" x="744.0" y="596.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the compiled control at the source, and only the</text><text id="t-push-42" x="744.0" y="622.15" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">metrics come back.</text><line id="a43" x1="1210" y1="444.25" x2="370.0" y2="484.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a44" x1="1210" y1="444.25" x2="1030.0" y2="484.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-refuse" x="60" y="693.25" width="1280" height="117" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-refuse-45" x="84" y="725.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">Refusals, not fallbacks: a predicate the connector cannot apply, a sampling strategy it cannot draw, a path</text><text id="t-refuse-46" x="84" y="752.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">the read policy does not allow. Each raises with a remedy, so a table is never quietly recorded as one day of</text><text id="t-refuse-47" x="84" y="779.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">itself.</text></svg>