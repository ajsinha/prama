<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="772" viewBox="0 0 1400 772"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="772" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">From a metric to a person, and which parts are yours</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">A detector scores; the calibrator decides how unusual the score is; the router decides who hears,</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">once; a notifier carries the message. The detector and the notifier are yours.</text><rect id="box-mon0" x="60.0" y="203.25" width="188.33333333333334" height="229" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="205.25" width="184.33333333333334" height="8" rx="3" fill="#8A93AD"/><text id="t-mon0-4" x="84.0" y="251.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">History</text><text id="t-mon0-5" x="84.0" y="280.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">one metric</text><text id="t-mon0-6" x="84.0" y="304.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">over time:</text><text id="t-mon0-7" x="84.0" y="328.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">rows, null</text><text id="t-mon0-8" x="84.0" y="352.95000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">rate,</text><text id="t-mon0-9" x="84.0" y="377.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">freshness</text><rect id="box-mon1" x="278.33333333333337" y="203.25" width="188.33333333333334" height="229" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="280.33333333333337" y="205.25" width="184.33333333333334" height="8" rx="3" fill="#2B3FA8"/><text id="t-mon1-10" x="302.33333333333337" y="251.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Detector.score</text><text id="t-mon1-11" x="302.33333333333337" y="280.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">a</text><text id="t-mon1-12" x="302.33333333333337" y="304.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">nonconformity</text><text id="t-mon1-13" x="302.33333333333337" y="328.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">score: larger</text><text id="t-mon1-14" x="302.33333333333337" y="352.95000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">when</text><text id="t-mon1-15" x="302.33333333333337" y="377.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">stranger.</text><text id="t-mon1-16" x="302.33333333333337" y="401.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Your class.</text><line id="a17" x1="252.33333333333337" y1="317.75" x2="272.33333333333337" y2="317.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-mon2" x="496.6666666666667" y="203.25" width="188.33333333333334" height="229" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="498.6666666666667" y="205.25" width="184.33333333333334" height="8" rx="3" fill="#00B3A4"/><text id="t-mon2-18" x="520.6666666666667" y="251.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Conformal</text><text id="t-mon2-19" x="520.6666666666667" y="280.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">calibration</text><text id="t-mon2-20" x="520.6666666666667" y="309.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">a p-value</text><text id="t-mon2-21" x="520.6666666666667" y="334.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">with a</text><text id="t-mon2-22" x="520.6666666666667" y="358.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">false-alarm</text><text id="t-mon2-23" x="520.6666666666667" y="382.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">bound alpha</text><line id="a24" x1="470.6666666666667" y1="317.75" x2="490.6666666666667" y2="317.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-mon3" x="715.0" y="203.25" width="188.33333333333334" height="229" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="717.0" y="205.25" width="184.33333333333334" height="8" rx="3" fill="#E8B33A"/><text id="t-mon3-25" x="739.0" y="251.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Alert</text><text id="t-mon3-26" x="739.0" y="280.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">fault,</text><text id="t-mon3-27" x="739.0" y="304.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">dataset,</text><text id="t-mon3-28" x="739.0" y="328.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">change since</text><text id="t-mon3-29" x="739.0" y="352.95000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the last</text><text id="t-mon3-30" x="739.0" y="377.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">message</text><line id="a31" x1="689.0" y1="317.75" x2="709.0" y2="317.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-mon4" x="933.3333333333334" y="203.25" width="188.33333333333334" height="229" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="935.3333333333334" y="205.25" width="184.33333333333334" height="8" rx="3" fill="#2FB673"/><text id="t-mon4-32" x="957.3333333333334" y="251.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Router</text><text id="t-mon4-33" x="957.3333333333334" y="280.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">fault to</text><text id="t-mon4-34" x="957.3333333333334" y="304.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">role, quiet</text><text id="t-mon4-35" x="957.3333333333334" y="328.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">period,</text><text id="t-mon4-36" x="957.3333333333334" y="352.95000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">digest,</text><text id="t-mon4-37" x="957.3333333333334" y="377.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">residency</text><text id="t-mon4-38" x="957.3333333333334" y="401.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">gate</text><line id="a39" x1="907.3333333333334" y1="317.75" x2="927.3333333333334" y2="317.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-mon5" x="1151.6666666666667" y="203.25" width="188.33333333333334" height="229" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="1153.6666666666667" y="205.25" width="184.33333333333334" height="8" rx="3" fill="#2B3FA8"/><text id="t-mon5-40" x="1175.6666666666667" y="251.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Notifier</text><text id="t-mon5-41" x="1175.6666666666667" y="280.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">deliver: one</text><text id="t-mon5-42" x="1175.6666666666667" y="304.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">message, one</text><text id="t-mon5-43" x="1175.6666666666667" y="328.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">channel. log,</text><text id="t-mon5-44" x="1175.6666666666667" y="352.95000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">webhook,</text><text id="t-mon5-45" x="1175.6666666666667" y="377.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">email, or</text><text id="t-mon5-46" x="1175.6666666666667" y="401.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">yours.</text><line id="a47" x1="1125.6666666666667" y1="317.75" x2="1145.6666666666667" y2="317.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-valid" x="60" y="472.25" width="1280" height="90" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-valid-48" x="84" y="504.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">A badly chosen detector costs sensitivity, never validity: noise scores are exchangeable with calibration</text><text id="t-valid-49" x="84" y="531.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">scores, so the false-alarm rate still holds and the monitor simply finds less.</text><rect id="box-gap" x="60" y="612.25" width="1280" height="112" rx="14" fill="#F3F5FA" stroke="#F3F5FA" stroke-width="2"/><text id="t-gap-50" x="84" y="643.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">After every run, prama.alert.pipeline turns failing records into alerts, routes them with what was already sent</text><text id="t-gap-51" x="84" y="668.9" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">(kept in the database), delivers the immediate ones and queues the rest for the daily digest. A delivery failure is</text><text id="t-gap-52" x="84" y="694.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">recorded against the alert and never fails the run.</text></svg>