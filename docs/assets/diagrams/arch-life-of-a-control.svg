<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1751" viewBox="0 0 1400 1751"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="1751" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">The life of a control</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">From what an owner says the data means to a verdict somebody else can check. Left: the step. Right:</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the code that performs it.</text><rect id="box-p0" x="60" y="183.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="185.25" width="456" height="8" rx="3" fill="#0E1A46"/><text id="t-p0-4" x="84" y="233.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">1. Declare</text><text id="t-p0-5" x="84" y="265.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">An owner states grain, rhythm,</text><text id="t-p0-6" x="84" y="294.20000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">domains, relationships, metadata.</text><rect id="box-pc0" x="550" y="183.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc0-7" x="570" y="213.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama.semantic.services.DatasetService</text><text id="t-pc0-8" x="570" y="237.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">sem_dataset_version (bitemporal)</text><text id="t-pc0-9" x="570" y="261.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">ApprovalPolicy: tier 1 needs maker-checker</text><line id="a10" x1="522" y1="260.75" x2="546" y2="260.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a11" x1="290.0" y1="340.25" x2="290.0" y2="374.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p1" x="60" y="378.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="380.25" width="456" height="8" rx="3" fill="#2B3FA8"/><text id="t-p1-12" x="84" y="428.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">2. Derive and propose</text><text id="t-p1-13" x="84" y="460.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Deterministic generators turn each</text><text id="t-p1-14" x="84" y="489.20000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">fact into PQL.</text><rect id="box-pc1" x="550" y="378.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc1-15" x="570" y="408.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama.derive.ControlGenerator (Γ)</text><text id="t-pc1-16" x="570" y="432.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">controls.proposals.queue()</text><text id="t-pc1-17" x="570" y="456.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">propose.ProposalQueue: rejections remembered</text><line id="a18" x1="522" y1="455.75" x2="546" y2="455.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a19" x1="290.0" y1="535.25" x2="290.0" y2="569.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p2" x="60" y="573.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="575.25" width="456" height="8" rx="3" fill="#2B3FA8"/><text id="t-p2-20" x="84" y="623.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">3. Approve</text><text id="t-p2-21" x="84" y="655.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">A person accepts; the control</text><text id="t-p2-22" x="84" y="684.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">version becomes active.</text><rect id="box-pc2" x="550" y="573.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc2-23" x="570" y="603.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">controls.proposals.accept()</text><text id="t-pc2-24" x="570" y="627.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">ControlDao.declare, ControlDao.activate</text><text id="t-pc2-25" x="570" y="651.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">ctl_control_version.status = &#x27;active&#x27;</text><line id="a26" x1="522" y1="650.75" x2="546" y2="650.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a27" x1="290.0" y1="730.25" x2="290.0" y2="764.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p3" x="60" y="768.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="770.25" width="456" height="8" rx="3" fill="#2B3FA8"/><text id="t-p3-28" x="84" y="818.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">4. Compile</text><text id="t-p3-29" x="84" y="850.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">PQL parses, type-checks, lowers to</text><text id="t-p3-30" x="84" y="879.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">a hashed plan, then SQL.</text><rect id="box-pc3" x="550" y="768.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc3-31" x="570" y="798.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">pql.parse_control → ir.resolve.resolved</text><text id="t-pc3-32" x="570" y="822.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">ControlPlan plan_id = ir:sha256:…</text><text id="t-pc3-33" x="570" y="846.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">backend.compile_for(plan, dialect)</text><line id="a34" x1="522" y1="845.75" x2="546" y2="845.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a35" x1="290.0" y1="925.25" x2="290.0" y2="959.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p4" x="60" y="963.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="965.25" width="456" height="8" rx="3" fill="#00B3A4"/><text id="t-p4-36" x="84" y="1013.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">5. Execute</text><text id="t-p4-37" x="84" y="1045.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">On the server, or beside the data</text><text id="t-p4-38" x="84" y="1074.1999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">by an agent.</text><rect id="box-pc4" x="550" y="963.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc4-39" x="570" y="993.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">execute.run.ControlRun.execute_all</text><text id="t-pc4-40" x="570" y="1017.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">or prama_agent.runner.Agent.run</text><text id="t-pc4-41" x="570" y="1041.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">read-only sources; the agent never compiles</text><line id="a42" x1="522" y1="1040.75" x2="546" y2="1040.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a43" x1="290.0" y1="1120.25" x2="290.0" y2="1154.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p5" x="60" y="1158.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="1160.25" width="456" height="8" rx="3" fill="#00B3A4"/><text id="t-p5-44" x="84" y="1208.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">6. Judge</text><text id="t-p5-45" x="84" y="1240.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">One deterministic function decides</text><text id="t-p5-46" x="84" y="1269.1999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the verdict.</text><rect id="box-pc5" x="550" y="1158.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc5-47" x="570" y="1188.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama_kernel.judge.judge / judge_segments</text><text id="t-pc5-48" x="570" y="1212.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">pass | fail | indeterminate | error | skipped</text><line id="a49" x1="522" y1="1235.75" x2="546" y2="1235.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a50" x1="290.0" y1="1315.25" x2="290.0" y2="1349.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p6" x="60" y="1353.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="1355.25" width="456" height="8" rx="3" fill="#2FB673"/><text id="t-p6-51" x="84" y="1403.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">7. Record</text><text id="t-p6-52" x="84" y="1435.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Each verdict becomes a hash-chained</text><text id="t-p6-53" x="84" y="1464.1999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">evidence record.</text><rect id="box-pc6" x="550" y="1353.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc6-54" x="570" y="1383.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">EvidenceDao.append(EvidenceRecord)</text><text id="t-pc6-55" x="570" y="1407.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">record_hash = sha256(prev + content)</text><text id="t-pc6-56" x="570" y="1431.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">evidence.anchor: RFC 3161 witness</text><line id="a57" x1="522" y1="1430.75" x2="546" y2="1430.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a58" x1="290.0" y1="1510.25" x2="290.0" y2="1544.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p7" x="60" y="1548.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="1550.25" width="456" height="8" rx="3" fill="#E8B33A"/><text id="t-p7-59" x="84" y="1598.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">8. Score, report, alert</text><text id="t-p7-60" x="84" y="1630.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Everything downstream derives from</text><text id="t-p7-61" x="84" y="1659.1999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the evidence.</text><rect id="box-pc7" x="550" y="1548.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc7-62" x="570" y="1578.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">score.scorecard, score.trust.TrustPropagator</text><text id="t-pc7-63" x="570" y="1602.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">report.attest, incident.triage, alert.route.Router</text><line id="a64" x1="522" y1="1625.75" x2="546" y2="1625.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/></svg>