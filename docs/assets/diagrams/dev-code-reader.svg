<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="687" viewBox="0 0 1400 687"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="687" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Code in, lineage out, nothing executed</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Code intake reads bytes in a separate, resource-limited process and chooses a reader by the kind of</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">each file.</text><rect id="box-code0" x="60.0" y="203.25" width="232.0" height="156" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="205.25" width="228.0" height="8" rx="3" fill="#8A93AD"/><text id="t-code0-4" x="84.0" y="251.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">ZIP or git</text><text id="t-code0-5" x="84.0" y="280.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">archive checks:</text><text id="t-code0-6" x="84.0" y="304.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">paths, links,</text><text id="t-code0-7" x="84.0" y="328.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">bombs</text><rect id="box-code1" x="322.0" y="203.25" width="232.0" height="156" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="324.0" y="205.25" width="228.0" height="8" rx="3" fill="#00B3A4"/><text id="t-code1-8" x="346.0" y="251.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">kind_of(path)</text><text id="t-code1-9" x="346.0" y="280.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">suffix, refined by</text><text id="t-code1-10" x="346.0" y="304.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the first bytes</text><line id="a11" x1="296.0" y1="281.25" x2="316.0" y2="281.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-code2" x="584.0" y="203.25" width="232.0" height="156" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="586.0" y="205.25" width="228.0" height="8" rx="3" fill="#2FB673"/><text id="t-code2-12" x="608.0" y="251.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">_extract(kind)</text><text id="t-code2-13" x="608.0" y="280.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the worker&#x27;s</text><text id="t-code2-14" x="608.0" y="304.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">dispatch: one</text><text id="t-code2-15" x="608.0" y="328.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">branch per kind</text><line id="a16" x1="558.0" y1="281.25" x2="578.0" y2="281.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-code3" x="846.0" y="203.25" width="232.0" height="156" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="848.0" y="205.25" width="228.0" height="8" rx="3" fill="#2B3FA8"/><text id="t-code3-17" x="870.0" y="251.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Scanner.scan</text><text id="t-code3-18" x="870.0" y="280.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">or SqlLineage: an</text><text id="t-code3-19" x="870.0" y="304.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Extraction of</text><text id="t-code3-20" x="870.0" y="328.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">edges and gaps</text><line id="a21" x1="820.0" y1="281.25" x2="840.0" y2="281.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-code4" x="1108.0" y="203.25" width="232.0" height="156" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="1110.0" y="205.25" width="228.0" height="8" rx="3" fill="#E8B33A"/><text id="t-code4-22" x="1132.0" y="251.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Lineage store</text><text id="t-code4-23" x="1132.0" y="280.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">parsed, or</text><text id="t-code4-24" x="1132.0" y="304.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">inferred until a</text><text id="t-code4-25" x="1132.0" y="328.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">person confirms</text><line id="a26" x1="1082.0" y1="281.25" x2="1102.0" y2="281.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-tables" x="60" y="399.25" width="1280" height="90" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-tables-27" x="84" y="431.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">Three tables to touch when you add a reader: READ in inventory.py (what is read, and by what), the branch in</text><text id="t-tables-28" x="84" y="458.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">worker._extract, and PARSED_METHODS in service.py if its edges are verified rather than inferred.</text><rect id="box-cover" x="60" y="549.25" width="1280" height="90" rx="14" fill="#F3F5FA" stroke="#F3F5FA" stroke-width="2"/><text id="t-cover-29" x="84" y="581.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">Coverage is always reported: units found, units read, and every gap named, so a graph that is forty percent</text><text id="t-cover-30" x="84" y="608.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">complete says so.</text></svg>