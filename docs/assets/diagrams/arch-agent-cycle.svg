<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1361" viewBox="0 0 1400 1361"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="1361" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">One daemon cycle beside the data</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama-agent run loops this until stopped; --once loops it until a cycle runs nothing. Every step</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">that can fail becomes a finding or a gap, never a crash.</text><rect id="box-p0" x="60" y="183.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="185.25" width="456" height="8" rx="3" fill="#0E1A46"/><text id="t-p0-4" x="84" y="233.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Hello</text><text id="t-p0-5" x="84" y="265.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Free slots, pending findings,</text><text id="t-p0-6" x="84" y="294.20000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">capabilities derived from config.</text><rect id="box-pc0" x="550" y="183.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc0-7" x="570" y="213.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama_agent.runner.Agent.hello</text><text id="t-pc0-8" x="570" y="237.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">daemon.capabilities_for</text><line id="a9" x1="522" y1="260.75" x2="546" y2="260.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a10" x1="290.0" y1="340.25" x2="290.0" y2="374.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p1" x="60" y="378.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="380.25" width="456" height="8" rx="3" fill="#00B3A4"/><text id="t-p1-11" x="84" y="428.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Run each assignment</text><text id="t-p1-12" x="84" y="460.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">On the source the binding names,</text><text id="t-p1-13" x="84" y="489.20000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">opened read-only.</text><rect id="box-pc1" x="550" y="378.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc1-14" x="570" y="408.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama_agent.executors: sqlite mode=ro,</text><text id="t-pc1-15" x="570" y="432.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">duckdb read_only, postgres read_only</text><line id="a16" x1="522" y1="455.75" x2="546" y2="455.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a17" x1="290.0" y1="535.25" x2="290.0" y2="569.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p2" x="60" y="573.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="575.25" width="456" height="8" rx="3" fill="#00B3A4"/><text id="t-p2-18" x="84" y="623.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Judge</text><text id="t-p2-19" x="84" y="655.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">With the plan&#x27;s own threshold, in</text><text id="t-p2-20" x="84" y="684.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the shared kernel.</text><rect id="box-pc2" x="550" y="573.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc2-21" x="570" y="603.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama_kernel.judge.judge</text><text id="t-pc2-22" x="570" y="627.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">recon.pql.measure, DelegateHost</text><line id="a23" x1="522" y1="650.75" x2="546" y2="650.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a24" x1="290.0" y1="730.25" x2="290.0" y2="764.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p3" x="60" y="768.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="770.25" width="456" height="8" rx="3" fill="#E8B33A"/><text id="t-p3-25" x="84" y="818.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Redact</text><text id="t-p3-26" x="84" y="850.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Rows stay on the machine under</text><text id="t-p3-27" x="84" y="879.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">every disposition.</text><rect id="box-pc3" x="550" y="768.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc3-28" x="570" y="798.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama_kernel.agent.residency.Boundary.apply</text><text id="t-pc3-29" x="570" y="822.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">withhold | fingerprint | mask | send</text><line id="a30" x1="522" y1="845.75" x2="546" y2="845.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a31" x1="290.0" y1="925.25" x2="290.0" y2="959.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p4" x="60" y="963.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="965.25" width="456" height="8" rx="3" fill="#E8B33A"/><text id="t-p4-32" x="84" y="1013.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Spool</text><text id="t-p4-33" x="84" y="1045.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Hash-chained; full means the oldest</text><text id="t-p4-34" x="84" y="1074.1999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">go, as a numbered gap.</text><rect id="box-pc4" x="550" y="963.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc4-35" x="570" y="993.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama_kernel.agent.spool (spool.json)</text><text id="t-pc4-36" x="570" y="1017.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">capacity 50,000; written whole, renamed</text><line id="a37" x1="522" y1="1040.75" x2="546" y2="1040.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a38" x1="290.0" y1="1120.25" x2="290.0" y2="1154.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p5" x="60" y="1158.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="1160.25" width="456" height="8" rx="3" fill="#2FB673"/><text id="t-p5-39" x="84" y="1208.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Report, then wait</text><text id="t-p5-40" x="84" y="1240.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Until the spool is empty; then</text><text id="t-p5-41" x="84" y="1269.1999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">poll_after_seconds.</text><rect id="box-pc5" x="550" y="1158.25" width="790" height="155" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc5-42" x="570" y="1188.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">Agent.report: 500 findings per batch</text><text id="t-pc5-43" x="570" y="1212.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">unreachable: jittered exponential backoff</text><line id="a44" x1="522" y1="1235.75" x2="546" y2="1235.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/></svg>