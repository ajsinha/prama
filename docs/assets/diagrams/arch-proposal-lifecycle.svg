<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="820" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Where controls come from, and the four states they can be in</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Every origin reaches the same queue. Only a person turns a proposal into a running control, and a</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">rejection is remembered, not forgotten.</text><rect id="box-o0" x="60" y="183.25" width="300" height="50" rx="25" fill="#0E1A46" stroke="#0E1A46" stroke-width="2"/><text id="t-o0-4" x="210.0" y="215.81" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">declaration · 100</text><line id="a5" x1="362" y1="208.25" x2="440" y2="373.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-o1" x="60" y="249.25" width="300" height="50" rx="25" fill="#2B3FA8" stroke="#2B3FA8" stroke-width="2"/><text id="t-o1-6" x="210.0" y="281.81" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">document · 80</text><line id="a7" x1="362" y1="274.25" x2="440" y2="373.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-o2" x="60" y="315.25" width="300" height="50" rx="25" fill="#2B3FA8" stroke="#2B3FA8" stroke-width="2"/><text id="t-o2-8" x="210.0" y="347.81" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">import · 60</text><line id="a9" x1="362" y1="340.25" x2="440" y2="373.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-o3" x="60" y="381.25" width="300" height="50" rx="25" fill="#2B3FA8" stroke="#2B3FA8" stroke-width="2"/><text id="t-o3-10" x="210.0" y="413.81" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">mining · 40</text><line id="a11" x1="362" y1="406.25" x2="440" y2="373.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-o4" x="60" y="447.25" width="300" height="50" rx="25" fill="#2B3FA8" stroke="#2B3FA8" stroke-width="2"/><text id="t-o4-12" x="210.0" y="479.81" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">example · 30</text><line id="a13" x1="362" y1="472.25" x2="440" y2="373.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-o5" x="60" y="513.25" width="300" height="50" rx="25" fill="#2B3FA8" stroke="#2B3FA8" stroke-width="2"/><text id="t-o5-14" x="210.0" y="545.81" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">induction · 20</text><line id="a15" x1="362" y1="538.25" x2="440" y2="373.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-q" x="444" y="213.25" width="400" height="330" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="446" y="215.25" width="396" height="8" rx="3" fill="#2B3FA8"/><text id="t-q-16" x="468" y="265.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">ProposalQueue.offer</text><text id="t-q-17" x="468" y="298.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">admitted, duplicate,</text><text id="t-q-18" x="468" y="327.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">corroborated (stronger origin</text><text id="t-q-19" x="468" y="355.34999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">kept), already_live,</text><text id="t-q-20" x="468" y="383.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">superseded, suppressed,</text><text id="t-q-21" x="468" y="412.04999999999995" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">reopened (violation rate</text><text id="t-q-22" x="468" y="440.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">moved 2x)</text><rect id="box-s0" x="940" y="183.25" width="400" height="56" rx="28" fill="#8A93AD" stroke="#8A93AD" stroke-width="2"/><text id="t-s0-23" x="1140.0" y="219.17" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">proposed</text><rect id="box-s1" x="940" y="263.25" width="400" height="56" rx="28" fill="#2FB673" stroke="#2FB673" stroke-width="2"/><text id="t-s1-24" x="1140.0" y="299.17" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">active</text><rect id="box-s2" x="940" y="343.25" width="400" height="56" rx="28" fill="#E8B33A" stroke="#E8B33A" stroke-width="2"/><text id="t-s2-25" x="1140.0" y="379.17" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">suppressed</text><rect id="box-s3" x="940" y="423.25" width="400" height="56" rx="28" fill="#5A6480" stroke="#5A6480" stroke-width="2"/><text id="t-s3-26" x="1140.0" y="459.17" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">retired</text><line id="a27" x1="846" y1="323.25" x2="936" y2="213.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-n" x="60" y="593.25" width="1280" height="132" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-n-28" x="84" y="628.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">ctl_control_version.status is one of these four (a CHECK constraint). Suppression needs an end date and</text><text id="t-n-29" x="84" y="656.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">a reason. Nothing is deleted. A rejection goes to ctl_rejection with one of six reasons; incorrect and</text><text id="t-n-30" x="84" y="684.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">coincidental indict the rule, the rest may be reconsidered when the data changes.</text></svg>