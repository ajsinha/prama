t-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">content_hash</text><text id="t-r0-6" x="80" y="271.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prev = h0</text><text id="t-r0-7" x="80" y="295.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">hash = h1</text><rect id="box-r1" x="390" y="193.25" width="280" height="170" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-r1-8" x="410" y="223.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">ev_record #1</text><text id="t-r1-9" x="410" y="247.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">content_hash</text><text id="t-r1-10" x="410" y="271.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prev = h1</text><text id="t-r1-11" x="410" y="295.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">hash = h2</text><line id="a12" x1="344" y1="278.25" x2="384" y2="278.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-r2" x="720" y="193.25" width="280" height="170" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-r2-13" x="740" y="223.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">ev_record #2</text><text id="t-r2-14" x="740" y="247.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">content_hash</text><text id="t-r2-15" x="740" y="271.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prev = h2</text><text id="t-r2-16" x="740" y="295.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">hash = h3</text><line id="a17" x1="674" y1="278.25" x2="714" y2="278.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-r3" x="1050" y="193.25" width="280" height="170" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-r3-18" x="1070" y="223.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">ev_record #3</text><text id="t-r3-19" x="1070" y="247.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">content_hash</text><text id="t-r3-20" x="1070" y="271.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prev = h3</text><text id="t-r3-21" x="1070" y="295.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">hash = h4</text><line id="a22" x1="1004" y1="278.25" x2="1044" y2="278.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-mr" x="60" y="413.25" width="600" height="150" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="415.25" width="596" height="8" rx="3" fill="#0E1A46"/><text id="t-mr-23" x="84" y="465.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">merkle_root(hashes)</text><text id="t-mr-24" x="84" y="498.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama.evidence.ledger: one digest for the</text><text id="t-mr-25" x="84" y="527.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">chain; an odd node is promoted</text><rect id="box-an" x="740" y="413.25" width="600" height="150" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="742" y="415.25" width="596" height="8" rx="3" fill="#E8B33A"/><text id="t-an-26" x="764" y="465.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Rfc3161Anchor</text><text id="t-an-27" x="764" y="498.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">evidence.anchor: the head time-stamped by a</text><text id="t-an-28" x="764" y="527.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">TSA, stored in ev_anchor</text><line id="a29" x1="200.0" y1="365.25" x2="200.0" y2="409.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a30" x1="530.0" y1="365.25" x2="530.0" y2="409.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a31" x1="860.0" y1="365.25" x2="860.0" y2="409.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a32" x1="1190.0" y1="365.25" x2="1190.0" y2="409.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-ex" x="60" y="623.25" width="600" height="160" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="625.25" width="596" height="8" rx="3" fill="#2FB673"/><text id="t-ex-33" x="84" y="675.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">prama evidence export bundle/</text><text id="t-ex-34" x="84" y="708.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">manifest.json, evidence.ndjson, anchors.json;</text><text id="t-ex-35" x="84" y="737.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">refused if the chain does not verify</text><rect id="box-vf" x="740" y="623.25" width="600" height="160" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="742" y="625.25" width="596" height="8" rx="3" fill="#2FB673"/><text id="t-vf-36" x="764" y="675.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">scripts/verify_evidence.py</text><text id="t-vf-37" x="764" y="708.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">imports nothing from Prama; checks count,</text><text id="t-vf-38" x="764" y="737.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">digest, chain, Merkle root, and anchors with</text><text id="t-vf-39" x="764" y="765.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">openssl ts -verify</text><line id="a40" x1="360" y1="565.25" x2="360" y2="619.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a41" x1="1040" y1="565.25" x2="1040" y2="619.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a42" x1="662" y1="703.25" x2="736" y2="703.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-eb" x="60" y="823.25" width="1280" height="132" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-eb-43" x="84" y="858.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">EvidenceBase owns ev_run, ev_record, ev_sample and ev_anchor, so no cascade from the platform schema can</text><text id="t-eb-44" x="84" y="886.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">reach them. Erasure replaces content with a sealed Tombstone and keeps the original content hash, so the</text><text id="t-eb-45" x="84" y="914.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">chain still links.</text></svg>