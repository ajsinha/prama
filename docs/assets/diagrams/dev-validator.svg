id="t-adm0-5" x="84.0" y="261.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Entry point</text><text id="t-adm0-6" x="84.0" y="290.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">prama.validators in the</text><text id="t-adm0-7" x="84.0" y="314.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">distribution&#x27;s metadata</text><rect id="box-adm1" x="387.5" y="213.25" width="297.5" height="162" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="389.5" y="215.25" width="293.5" height="8" rx="3" fill="#2FB673"/><text id="t-adm1-8" x="411.5" y="261.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Source scan</text><text id="t-adm1-9" x="411.5" y="290.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">no clock, network, file,</text><text id="t-adm1-10" x="411.5" y="314.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">model or dynamic import</text><line id="a11" x1="361.5" y1="294.25" x2="381.5" y2="294.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-adm2" x="715.0" y="213.25" width="297.5" height="162" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="717.0" y="215.25" width="293.5" height="8" rx="3" fill="#8CBF3F"/><text id="t-adm2-12" x="739.0" y="261.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Probes twice</text><text id="t-adm2-13" x="739.0" y="290.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">same answer, never</text><text id="t-adm2-14" x="739.0" y="314.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">raises on a blank</text><line id="a15" x1="689.0" y1="294.25" x2="709.0" y2="294.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-adm3" x="1042.5" y="213.25" width="297.5" height="162" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="1044.5" y="215.25" width="293.5" height="8" rx="3" fill="#E8B33A"/><text id="t-adm3-16" x="1066.5" y="261.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Implementation</text><text id="t-adm3-17" x="1066.5" y="290.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">hash</text><text id="t-adm3-18" x="1066.5" y="319.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">folded into every plan</text><text id="t-adm3-19" x="1066.5" y="344.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">that names it</text><line id="a20" x1="1016.5" y1="294.25" x2="1036.5" y2="294.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><text id="t21" x="60" y="427.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#2B3FA8" text-anchor="start" xml:space="preserve">EVERY RUN</text><rect id="box-run0" x="60.0" y="445.25" width="297.5" height="156" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="447.25" width="293.5" height="8" rx="3" fill="#00B3A4"/><text id="t-run0-22" x="84.0" y="493.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Screen in SQL</text><text id="t-run0-23" x="84.0" y="522.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">screen_pattern: a</text><text id="t-run0-24" x="84.0" y="546.3499999999999" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">necessary condition</text><text id="t-run0-25" x="84.0" y="570.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">every valid value meets</text><rect id="box-run1" x="387.5" y="445.25" width="297.5" height="156" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="389.5" y="447.25" width="293.5" height="8" rx="3" fill="#2FB673"/><text id="t-run1-26" x="411.5" y="493.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Survivors</text><text id="t-run1-27" x="411.5" y="522.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">rows that pass the</text><text id="t-run1-28" x="411.5" y="546.3499999999999" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">screen, fetched to the</text><text id="t-run1-29" x="411.5" y="570.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">residual</text><line id="a30" x1="361.5" y1="523.25" x2="381.5" y2="523.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-run2" x="715.0" y="445.25" width="297.5" height="156" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="717.0" y="447.25" width="293.5" height="8" rx="3" fill="#2B3FA8"/><text id="t-run2-31" x="739.0" y="493.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">check(value)</text><text id="t-run2-32" x="739.0" y="522.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the algorithm: a</text><text id="t-run2-33" x="739.0" y="546.3499999999999" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Judgement with a reason</text><line id="a34" x1="689.0" y1="523.25" x2="709.0" y2="523.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-run3" x="1042.5" y="445.25" width="297.5" height="156" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="1044.5" y="447.25" width="293.5" height="8" rx="3" fill="#E8B33A"/><text id="t-run3-35" x="1066.5" y="493.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Verdict</text><text id="t-run3-36" x="1066.5" y="522.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">fail with reasons;</text><text id="t-run3-37" x="1066.5" y="546.3499999999999" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">indeterminate if the</text><text id="t-run3-38" x="1066.5" y="570.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">residual did not run</text><line id="a39" x1="1016.5" y1="523.25" x2="1036.5" y2="523.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-why" x="60" y="637.25" width="1280" height="90" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-why-40" x="84" y="669.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">PATTERN and CODELIST validators are complete in SQL. An ALGORITHM validator is not: GB0000000000 passes every</text><text id="t-why-41" x="84" y="696.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">ISIN regex and is not an ISIN, so the screen narrows and the check decides.</text></svg>