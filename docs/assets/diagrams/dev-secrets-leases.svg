<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="745" viewBox="0 0 1400 745"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="745" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">References in, values out; one holder at a time</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">A secret provider turns a reference into a value that will not print. A lease provider makes one</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">instance of a fleet do a job, provably.</text><text id="t4" x="60" y="195.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#2B3FA8" text-anchor="start" xml:space="preserve">SECRETS</text><rect id="box-sec0" x="60.0" y="213.25" width="297.5" height="132" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="215.25" width="293.5" height="8" rx="3" fill="#8A93AD"/><text id="t-sec0-5" x="84.0" y="261.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">SecretRef</text><text id="t-sec0-6" x="84.0" y="290.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">scheme://location#key,</text><text id="t-sec0-7" x="84.0" y="314.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">parsed; never the value</text><rect id="box-sec1" x="387.5" y="213.25" width="297.5" height="132" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="389.5" y="215.25" width="293.5" height="8" rx="3" fill="#00B3A4"/><text id="t-sec1-8" x="411.5" y="261.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">SecretResolver</text><text id="t-sec1-9" x="411.5" y="290.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">by scheme; cached; every</text><text id="t-sec1-10" x="411.5" y="314.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">access audited</text><line id="a11" x1="361.5" y1="279.25" x2="381.5" y2="279.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-sec2" x="715.0" y="213.25" width="297.5" height="132" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="717.0" y="215.25" width="293.5" height="8" rx="3" fill="#2B3FA8"/><text id="t-sec2-12" x="739.0" y="261.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">SecretProvider.resolve</text><text id="t-sec2-13" x="739.0" y="290.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">your class: a value or a</text><text id="t-sec2-14" x="739.0" y="314.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">refusal with a remedy</text><line id="a15" x1="689.0" y1="279.25" x2="709.0" y2="279.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-sec3" x="1042.5" y="213.25" width="297.5" height="132" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="1044.5" y="215.25" width="293.5" height="8" rx="3" fill="#2FB673"/><text id="t-sec3-16" x="1066.5" y="261.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">SecretValue</text><text id="t-sec3-17" x="1066.5" y="290.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">reveal() is the one way</text><text id="t-sec3-18" x="1066.5" y="314.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">out</text><line id="a19" x1="1016.5" y1="279.25" x2="1036.5" y2="279.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><text id="t20" x="60" y="397.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#2B3FA8" text-anchor="start" xml:space="preserve">LEASES</text><rect id="box-lease0" x="60.0" y="415.25" width="297.5" height="156" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="417.25" width="293.5" height="8" rx="3" fill="#00B3A4"/><text id="t-lease0-21" x="84.0" y="463.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">acquire</text><text id="t-lease0-22" x="84.0" y="492.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">atomic: None if another</text><text id="t-lease0-23" x="84.0" y="516.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">holder owns it</text><rect id="box-lease1" x="387.5" y="415.25" width="297.5" height="156" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="389.5" y="417.25" width="293.5" height="8" rx="3" fill="#2FB673"/><text id="t-lease1-24" x="411.5" y="463.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">LeaseHolder</text><text id="t-lease1-25" x="411.5" y="492.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">renews in the</text><text id="t-lease1-26" x="411.5" y="516.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">background; reports loss</text><line id="a27" x1="361.5" y1="493.25" x2="381.5" y2="493.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-lease2" x="715.0" y="415.25" width="297.5" height="156" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="717.0" y="417.25" width="293.5" height="8" rx="3" fill="#E8B33A"/><text id="t-lease2-28" x="739.0" y="463.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">fencing_token</text><text id="t-lease2-29" x="739.0" y="492.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">strictly increasing; a</text><text id="t-lease2-30" x="739.0" y="516.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" 