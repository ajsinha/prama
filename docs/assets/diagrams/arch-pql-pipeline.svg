 y="265.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Keywords are recognised, not</text><text id="t-p0-6" x="84" y="294.20000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">reserved: a column may be called</text><text id="t-p0-7" x="84" y="322.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">severity.</text><rect id="box-pc0" x="550" y="183.25" width="790" height="183" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pc0-8" x="570" y="213.25" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">prama.pql.tokens.tokenise / Lexer</text><line id="a9" x1="522" y1="274.75" x2="546" y2="274.75" stroke="#8A93AD" stroke-width="2" marker-end="url(#head)"/><line id="a10" x1="290.0" y1="368.25" x2="290.0" y2="402.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-p1" x="60" y="406.25" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="408.25" width="456" height="8" rx="3" fill="#0E1A46"/><text id="t-p1-11" x="84" y="456.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Syntax tree</text><text id="t-p1-12" x="84" y="488.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Recursive descent; every error</text><text id="t-p1-13" x="84" y="517.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">carries a caret and a remedy.</text><rect id="box-pc1" x="550" y="406.25" wid