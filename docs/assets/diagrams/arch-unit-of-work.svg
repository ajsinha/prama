<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="1000" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">The database layer: one package, two bases, no migrations</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Only prama.db imports SQLAlchemy. Everything else asks a DAO through the unit of work, and the live</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">schema is checked against two files rather than migrated.</text><rect id="box-db" x="60" y="183.25" width="1280" height="130" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="185.25" width="1276" height="8" rx="3" fill="#0E1A46"/><text id="t-db-4" x="84" y="235.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">prama.db.Database</text><text id="t-db-5" x="84" y="268.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">from_config; initialise() applies schema/&lt;dialect&gt;.sql; verify() fails loudly on drift; unit_of_work();</text><text id="t-db-6" x="84" y="297.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">lease_provider()</text><rect id="box-uow" x="60" y="363.25" width="1280" height="130" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="365.25" width="1276" height="8" rx="3" fill="#2B3FA8"/><text id="t-uow-7" x="84" y="415.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">prama.db.session.UnitOfWork</text><text id="t-uow-8" x="84" y="448.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">async with: one transaction; DAOs are lazy properties built as cls(session, dialect); db.guard.guarded</text><text id="t-uow-9" x="84" y="477.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">turns IntegrityError into ConflictError</text><line id="a10" x1="700" y1="315.25" x2="700" y2="359.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-b0" x="60.0" y="543.25" width="406.6666666666667" height="212" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="545.25" width="402.6666666666667" height="8" rx="3" fill="#00B3A4"/><text id="t-b0-11" x="84.0" y="595.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Base</text><text id="t-b0-12" x="84.0" y="628.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">platform and semantic tables:</text><text id="t-b0-13" x="84.0" y="657.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">tenant, principal, sem_*,</text><text id="t-b0-14" x="84.0" y="685.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">ctl_*, lin_*, llm_*, fl_*,</text><text id="t-b0-15" x="84.0" y="713.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">md_*, gl_* …</text><rect id="box-b1" x="496.6666666666667" y="543.25" width="406.6666666666667" height="212" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="498.6666666666667" y="545.25" width="402.6666666666667" height="8" rx="3" fill="#2FB673"/><text id="t-b1-16" x="520.6666666666667" y="595.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">EvidenceBase</text><text id="t-b1-17" x="520.6666666666667" y="628.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">ev_run, ev_record, ev_sample,</text><text id="t-b1-18" x="520.6666666666667" y="657.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">ev_anchor: no foreign key into</text><text id="t-b1-19" x="520.6666666666667" y="685.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the platform, no updated_at</text><rect id="box-b2" x="933.3333333333334" y="543.25" width="406.6666666666667" height="212" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="935.3333333333334" y="545.25" width="402.6666666666667" height="8" rx="3" fill="#E8B33A"/><text id="t-b2-20" x="957.3333333333334" y="595.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Dialect</text><text id="t-b2-21" x="957.3333333333334" y="628.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">db.dialects: the only module</text><text id="t-b2-22" x="957.3333333333334" y="657.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">that branches on sqlite or</text><text id="t-b2-23" x="957.3333333333334" y="685.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">postgres</text><line id="a24" x1="270" y1="495.25" x2="270" y2="539.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a25" x1="700" y1="495.25" x2="700" y2="539.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a26" x1="1130" y1="495.25" x2="1130" y2="539.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-n" x="60" y="795.25" width="1280" height="132" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-n-27" x="84" y="830.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">schema/sqlite.sql and schema/postgres.sql are byte-identical apart from their headers, and use only</text><text id="t-n-28" x="84" y="858.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">VARCHAR(n), TEXT, INTEGER and REAL. A changed table is a changed CREATE TABLE and a fresh prama db init;</text><text id="t-n-29" x="84" y="886.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">there is no ALTER anywhere.</text></svg>