<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="943" viewBox="0 0 1400 943"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="943" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Four distributions, and which way the imports go</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">One repository ships four Python packages. Arrows are imports; the dashed one is HTTP. Nothing</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">points back up.</text><rect id="box-server" x="60" y="193.25" width="560" height="230" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="195.25" width="556" height="8" rx="3" fill="#0E1A46"/><text id="t-server-4" x="84" y="245.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">prama: the server</text><text id="t-server-5" x="84" y="278.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">src/prama. FastAPI, SQLAlchemy, DuckDB,</text><text id="t-server-6" x="84" y="307.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">sqlglot. Console, API, CLI, scheduler,</text><text id="t-server-7" x="84" y="335.34999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">compiler, evidence ledger. 27 of its</text><text id="t-server-8" x="84" y="363.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">modules are aliases of kernel modules.</text><rect id="box-sdk" x="780" y="193.25" width="560" height="230" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="782" y="195.25" width="556" height="8" rx="3" fill="#2B3FA8"/><text id="t-sdk-9" x="804" y="245.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">prama-sdk</text><text id="t-sdk-10" x="804" y="278.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">sdk/src/prama_sdk. httpx and PyYAML only.</text><text id="t-sdk-11" x="804" y="307.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">What a client installs: one method per</text><text id="t-sdk-12" x="804" y="335.34999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">endpoint, the server&#x27;s errors mapped to its</text><text id="t-sdk-13" x="804" y="363.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">own.</text><rect id="box-kernel" x="60" y="503.25" width="560" height="230" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="505.25" width="556" height="8" rx="3" fill="#00B3A4"/><text id="t-kernel-14" x="84" y="555.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">prama-kernel</text><text id="t-kernel-15" x="84" y="588.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">kernel/src/prama_kernel. Standard library</text><text id="t-kernel-16" x="84" y="617.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">only. The plan model, judge, evidence</text><text id="t-kernel-17" x="84" y="645.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">record, reconciliation, calendars, delegate</text><text id="t-kernel-18" x="84" y="673.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">runtime, agent protocol.</text><rect id="box-agent" x="780" y="503.25" width="560" height="230" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="782" y="505.25" width="556" height="8" rx="3" fill="#2FB673"/><text id="t-agent-19" x="804" y="555.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">prama-agent</text><text id="t-agent-20" x="804" y="588.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">agent/src/prama_agent. The daemon beside</text><text id="t-agent-21" x="804" y="617.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the data. Depends on the kernel and the</text><text id="t-agent-22" x="804" y="645.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">SDK, PyYAML, and duckdb or psycopg as</text><text id="t-agent-23" x="804" y="673.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">extras.</text><line id="a24" x1="340.0" y1="425.25" x2="340.0" y2="497.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><text id="t25" x="354.0" y="461.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">imports</text><line id="a26" x1="778" y1="618.25" x2="626" y2="618.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><text id="t27" x="650" y="607.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="middle" xml:space="preserve">imports</text><line id="a28" x1="1060.0" y1="501.25" x2="1060.0" y2="429.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><text id="t29" x="1074.0" y="461.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">imports</text><line id="a30" x1="778" y1="308.25" x2="626" y2="308.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)" stroke-dasharray="10 8"/><text id="t31" x="700" y="297.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="middle" xml:space="preserve">HTTP</text><rect id="box-rule" x="60" y="763.25" width="1280" height="132" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-rule-32" x="84" y="798.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">Enforced by tests/architecture/test_packages_standalone.py: no module imports against the arrows; the</text><text id="t-rule-33" x="84" y="826.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">kernel, the SDK and a full agent cycle each run with prama made unimportable; each wheel carries only</text><text id="t-rule-34" x="84" y="854.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">its own package and requires only its declared dependencies.</text></svg>