<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="518" viewBox="0 0 1400 518"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="518" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Every endpoint has an SDK method, and every method an endpoint</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">The decorator files a method under the route it calls; the parity test compares that registry with</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the server&#x27;s OpenAPI document.</text><rect id="box-srv" x="60" y="203.25" width="580.0" height="137" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="205.25" width="576.0" height="8" rx="3" fill="#2B3FA8"/><text id="t-srv-4" x="84" y="253.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Server</text><text id="t-srv-5" x="84" y="283.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">create_app(config).openapi(): every (method, path)</text><text id="t-srv-6" x="84" y="309.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">under /api/v1</text><rect id="box-sdk" x="760.0" y="203.25" width="580.0" height="137" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="762.0" y="205.25" width="576.0" height="8" rx="3" fill="#2FB673"/><text id="t-sdk-7" x="784.0" y="253.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">SDK</text><text id="t-sdk-8" x="784.0" y="283.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">@endpoint(method, path) on a Resource method;</text><text id="t-sdk-9" x="784.0" y="309.5" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">base.ENDPOINTS</text><line id="a10" x1="648.0" y1="271.75" x2="752.0" y2="271.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a11" x1="752.0" y1="295.75" x2="648.0" y2="295.75" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-parity" x="60" y="380.25" width="1280" height="90" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-parity-12" x="84" y="412.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">tests/sdk/test_parity.py fails on an endpoint with no method (missing) and on a method calling no endpoint</text><text id="t-parity-13" x="84" y="439.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">(phantom), and proves it can fail by filing a phantom of its own.</text></svg>