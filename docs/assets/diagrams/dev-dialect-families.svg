<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="628" viewBox="0 0 1400 628"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="628" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Three dialect families, three different jobs</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Same word, different seams. Pick the one whose job your engine changes.</text><rect id="box-fam0" x="60.0" y="166.2" width="400.0" height="291" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62.0" y="168.2" width="396.0" height="8" rx="3" fill="#00B3A4"/><text id="t-fam0-3" x="84.0" y="216.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Reading a source</text><text id="t-fam0-4" x="84.0" y="246.79999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">connect.sources.sql.dialect.SqlDialect</text><text id="t-fam0-5" x="84.0" y="272.45" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">(ABC). Catalogue SQL, row</text><text id="t-fam0-6" x="84.0" y="298.09999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">estimates, sampling, snapshots,</text><text id="t-fam0-7" x="84.0" y="323.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">read-only session setup. Oracle,</text><text id="t-fam0-8" x="84.0" y="349.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">SQL Server, DB2, Teradata, MySQL,</text><text id="t-fam0-9" x="84.0" y="375.04999999999995" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Redshift, Databricks, Synapse,</text><text id="t-fam0-10" x="84.0" y="400.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Trino, BigQuery, Snowflake,</text><text id="t-fam0-11" x="84.0" y="426.35" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">ClickHouse, PostgreSQL.</text><rect id="box-fam1" x="500.0" y="166.2" width="400.0" height="291" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="502.0" y="168.2" width="396.0" height="8" rx="3" fill="#2FB673"/><text id="t-fam1-12" x="524.0" y="216.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Compiling a control</text><text id="t-fam1-13" x="524.0" y="246.79999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">backend.dialect.SqlDialect, a</text><text id="t-fam1-14" x="524.0" y="272.45" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">concrete portable base. Quoting,</text><text id="t-fam1-15" x="524.0" y="298.09999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">literals, regex, count_if,</text><text id="t-fam1-16" x="524.0" y="323.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">modulo, capabilities. DIALECTS:</text><text id="t-fam1-17" x="524.0" y="349.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">postgresql, duckdb, sqlite. What</text><text id="t-fam1-18" x="524.0" y="375.04999999999995" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">compile_for(plan, engine) renders</text><text id="t-fam1-19" x="524.0" y="400.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">for.</text><rect id="box-fam2" x="940.0" y="166.2" width="400.0" height="291" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="942.0" y="168.2" width="396.0" height="8" rx="3" fill="#E8B33A"/><text id="t-fam2-20" x="964.0" y="216.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Prama&#x27;s own store</text><text id="t-fam2-21" x="964.0" y="246.79999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">db.dialects.Dialect (ABC). URLs,</text><text id="t-fam2-22" x="964.0" y="272.45" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">pools, on-connect setup,</text><text id="t-fam2-23" x="964.0" y="298.09999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">introspection, upsert. sqlite and</text><text id="t-fam2-24" x="964.0" y="323.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">postgres, chosen by</text><text id="t-fam2-25" x="964.0" y="349.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">database.dialect, and the only</text><text id="t-fam2-26" x="964.0" y="375.04999999999995" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">module allowed to branch on it.</text><rect id="box-fourth" x="60" y="493.2" width="1280" height="87" rx="14" fill="#F3F5FA" stroke="#F3F5FA" stroke-width="2"/><text id="t-fourth-27" x="84" y="524.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">A fourth, smaller one lives in the model gateway: llm.providers.Dialect names the request field an</text><text id="t-fourth-28" x="84" y="549.85" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">OpenAI-compatible server reads a grammar from. It is covered in the LLM providers guide.</text></svg>