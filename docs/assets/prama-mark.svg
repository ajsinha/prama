-->
  <title>Prama — the Pramana Prism</title>
  <defs>
    <linearGradient id="pr-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3FA8"/><stop offset="1" stop-color="#0E1A46"/>
    </linearGradient>
  </defs>
  <!-- raw, unverified input: broken beam -->
  <g stroke="#8A93AD" stroke-width="2.6" stroke-linecap="round">
    <line x1="2.5" y1="32" x2="8" y2="32"/>
    <line x1="11.5" y1="32" x2="15" y2="32"/>
    <line x1="18" y1="32" x2="21.2" y2="32"/>
  </g>
  <!-- the prism: the instrument of valid knowledge -->
  <path d="M32 11 L51 46.5 L13 46.5 Z" fill="none" stroke="url(#pr-edge)" stroke-width="3.2"
        stroke-linejoin="round"/>
  <!-- resolved spectrum: the six quality dimensions -->
  <g stroke-width="2.6" stroke-linecap="round">
    <line x1="43.2" y1="32" x2="61.5" y2="21.5" stroke="#00B3A4"/>
    <line x1="43.2" y1="32" x2="61.5" y2="25.7" stroke="#2FB673"/>
    <line x1="43.2" y1="32" x2="61.5" y2="29.9" stroke="#8CBF3F"/>
    <line x1="43.2" y1="32" x2="61.5" y2="34.1" stroke="#E8B33A"/>
    <line x1="43.2" y1="32" x2="61.5" y2="38.3" stroke="#E8823A"/>
    <line x1="43.2" y1="32" x2="61.5" y2="42.5" stroke="#D9534F"/>
  </g>
</svg>
