Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">28% · computed over those rows</text><line id="a27" x1="320" y1="641.25" x2="320" y2="653.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-join" x="60" y="753.25" width="1280" height="104" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-join-28" x="84" y="788.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">The join proposes: CHECK stg.trades.ccy REFERENCES ref.fx_rates.ccy. It fails on 3 of 1,882 staged</text><text id="t-join-29" x="84" y="816.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">trades, where 605,000,000 of notional would otherwise leave the mart with no error and no null.</text></svg>