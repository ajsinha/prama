<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="470" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Five verdicts, because two would lie</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Only one of them is green. Nothing else is ever rounded up to it.</text><rect id="box-v0" x="60" y="162.2" width="244" height="56" rx="28" fill="#2FB673" stroke="#2FB673" stroke-width="2"/><text id="t-v0-3" x="182.0" y="198.48" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">pass</text><rect id="box-m0" x="60" y="238.2" width="244" height="170" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-m0-4" x="78" y="273.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">The exact test</text><text id="t-m0-5" x="78" y="301.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">ran and found</text><text id="t-m0-6" x="78" y="329.9" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">nothing</text><rect id="box-v1" x="319" y="162.2" width="244" height="56" rx="28" fill="#D9534F" stroke="#D9534F" stroke-width="2"/><text id="t-v1-7" x="441.0" y="198.48" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">fail</text><rect id="box-m1" x="319" y="238.2" width="244" height="170" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-m1-8" x="337" y="273.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Violations above</text><text id="t-m1-9" x="337" y="301.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the threshold,</text><text id="t-m1-10" x="337" y="329.9" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">with counts and a</text><text id="t-m1-11" x="337" y="358.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">sample</text><rect id="box-v2" x="578" y="162.2" width="244" height="56" rx="28" fill="#E8B33A" stroke="#E8B33A" stroke-width="2"/><text id="t-v2-12" x="700.0" y="198.48" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">indeterminate</text><rect id="box-m2" x="578" y="238.2" width="244" height="170" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-m2-13" x="596" y="273.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">A screen ran, or</text><text id="t-m2-14" x="596" y="301.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">too little data:</text><text id="t-m2-15" x="596" y="329.9" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">not a pass</text><rect id="box-v3" x="837" y="162.2" width="244" height="56" rx="28" fill="#E8823A" stroke="#E8823A" stroke-width="2"/><text id="t-v3-16" x="959.0" y="198.48" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">error</text><rect id="box-m3" x="837" y="238.2" width="244" height="170" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-m3-17" x="855" y="273.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">The control could</text><text id="t-m3-18" x="855" y="301.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">not run, and says</text><text id="t-m3-19" x="855" y="329.9" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">so</text><rect id="box-v4" x="1096" y="162.2" width="244" height="56" rx="28" fill="#8A93AD" stroke="#8A93AD" stroke-width="2"/><text id="t-v4-20" x="1218.0" y="198.48" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">skipped</text><rect id="box-m4" x="1096" y="238.2" width="244" height="170" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-m4-21" x="1114" y="273.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Not run in this</text><text id="t-m4-22" x="1114" y="301.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">pass; recorded</text></svg>