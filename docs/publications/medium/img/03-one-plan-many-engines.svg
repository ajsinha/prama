<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="620" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">One plan, several engines, one verdict</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">PQL compiles to a versioned plan. The plan runs where the data lives, and the conformance suite</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">requires the same verdict on every engine.</text><rect id="box-pql" x="60" y="193.25" width="520" height="210" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-pql-4" x="84" y="233.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#2B3FA8" text-anchor="start" xml:space="preserve">PQL</text><text id="t-pql-5" x="84" y="273.25" font-family="'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">CHECK trades.notional &gt;= 0</text><text id="t-pql-6" x="84" y="299.25" font-family="'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">  SEVERITY critical</text><text id="t-pql-7" x="84" y="325.25" font-family="'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">  DIMENSION validity</text><text id="t-pql-8" x="84" y="351.25" font-family="'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">  BECAUSE &#x27;a notional is a size;</text><text id="t-pql-9" x="84" y="377.25" font-family="'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">    the side carries direction&#x27;</text><rect id="box-ir" x="640" y="198.25" width="240" height="200" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="642" y="200.25" width="236" height="8" rx="3" fill="#2B3FA8"/><text id="t-ir-10" x="664" y="250.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Plan (IR)</text><text id="t-ir-11" x="664" y="283.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">resolved,</text><text id="t-ir-12" x="664" y="312.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">versioned,</text><text id="t-ir-13" x="664" y="340.34999999999997" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">hashed into</text><text id="t-ir-14" x="664" y="368.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">evidence</text><line id="a15" x1="582" y1="298.25" x2="636" y2="298.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-e0" x="960" y="183.25" width="380" height="64" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="962" y="185.25" width="376" height="8" rx="3" fill="#00B3A4"/><text id="t-e0-16" x="984" y="233.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">SQLite</text><line id="a17" x1="882" y1="298.25" x2="956" y2="215.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-e1" x="960" y="261.25" width="380" height="64" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="962" y="263.25" width="376" height="8" rx="3" fill="#2FB673"/><text id="t-e1-18" x="984" y="311.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">DuckDB</text><line id="a19" x1="882" y1="298.25" x2="956" y2="293.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-e2" x="960" y="339.25" width="380" height="64" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="962" y="341.25" width="376" height="8" rx="3" fill="#E8B33A"/><text id="t-e2-20" x="984" y="389.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">PostgreSQL</text><line id="a21" x1="882" y1="298.25" x2="956" y2="371.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-fuse" x="60" y="443.25" width="1280" height="110" rx="14" fill="#E4E8F8" stroke="#E4E8F8" stroke-width="2"/><text id="t-fuse-22" x="84" y="483.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">Fusion: controls over the same table share one scan. In the fusion test, 400 controls run as 160</text><text id="t-fuse-23" x="84" y="512.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">scans. What does not push down to an engine is published, not hidden: prama control functions.</text></svg>