<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="560" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Green is a belief. Prama asks what justifies it.</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">A data quality claim is justified only when all three hold. Most estates have one.</text><rect id="box-belief" x="60" y="152.2" width="330" height="250" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="62" y="154.2" width="326" height="8" rx="3" fill="#8A93AD"/><text id="t-belief-3" x="84" y="204.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">“Trades are fine”</text><text id="t-belief-4" x="84" y="237.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">A dashboard is green.</text><text id="t-belief-5" x="84" y="265.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Somebody believes the</text><text id="t-belief-6" x="84" y="294.3" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">data. Nothing yet says</text><text id="t-belief-7" x="84" y="322.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">why they should.</text><rect id="box-p0" x="470" y="152.2" width="270" height="250" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="472" y="154.2" width="266" height="8" rx="3" fill="#00B3A4"/><text id="t-p0-8" x="494" y="204.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Declared</text><text id="t-p0-9" x="494" y="239.29999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">meaning</text><text id="t-p0-10" x="494" y="272.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">The control</text><text id="t-p0-11" x="494" y="301.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">derives from what</text><text id="t-p0-12" x="494" y="329.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">the owner said the</text><text id="t-p0-13" x="494" y="357.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">data means.</text><rect id="box-p1" x="770" y="152.2" width="270" height="250" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="772" y="154.2" width="266" height="8" rx="3" fill="#8CBF3F"/><text id="t-p1-14" x="794" y="204.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">A</text><text id="t-p1-15" x="794" y="239.29999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">deterministic</text><text id="t-p1-16" x="794" y="274.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">verdict</text><text id="t-p1-17" x="794" y="307.79999999999995" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">A versioned engine</text><text id="t-p1-18" x="794" y="336.15" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">decides. No model,</text><text id="t-p1-19" x="794" y="364.49999999999994" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">no mood.</text><rect id="box-p2" x="1070" y="152.2" width="270" height="250" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><rect x="1072" y="154.2" width="266" height="8" rx="3" fill="#E8823A"/><text id="t-p2-20" x="1094" y="204.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">Verifiable</text><text id="t-p2-21" x="1094" y="239.29999999999998" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">evidence</text><text id="t-p2-22" x="1094" y="272.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">The record checks</text><text id="t-p2-23" x="1094" y="301.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">out without</text><text id="t-p2-24" x="1094" y="329.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">trusting its</text><text id="t-p2-25" x="1094" y="357.75" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">author.</text><line id="a26" x1="392" y1="277.2" x2="466" y2="277.2" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-pram" x="470" y="442.2" width="870" height="70" rx="14" fill="#0E1A46" stroke="#0E1A46" stroke-width="2"/><text id="t-pram-27" x="905" y="487.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">pramā: knowledge that is true and arrived at by a reliable means</text><line id="a28" x1="605" y1="404.2" x2="605" y2="438.2" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a29" x1="905" y1="404.2" x2="905" y2="438.2" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><line id="a30" x1="1205" y1="404.2" x2="1205" y2="438.2" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/></svg>