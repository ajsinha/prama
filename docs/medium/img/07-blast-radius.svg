<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="783" viewBox="0 0 1400 783"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6480"/></marker></defs><rect width="1400" height="783" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="10" fill="#0E1A46"/><rect x="0.0" y="10" width="233.33333333333334" height="6" fill="#00B3A4"/><rect x="233.33333333333334" y="10" width="233.33333333333334" height="6" fill="#2FB673"/><rect x="466.6666666666667" y="10" width="233.33333333333334" height="6" fill="#8CBF3F"/><rect x="700.0" y="10" width="233.33333333333334" height="6" fill="#E8B33A"/><rect x="933.3333333333334" y="10" width="233.33333333333334" height="6" fill="#E8823A"/><rect x="1166.6666666666667" y="10" width="233.33333333333334" height="6" fill="#D9534F"/><text id="t1" x="60" y="78" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="38" font-weight="700" fill="#14182E" text-anchor="start" xml:space="preserve">From code to impact</text><text id="t2" x="60" y="117.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">Case study 8: lineage parsed from two SQL scripts and a Power BI model. How much of a defect in the</text><text id="t3" x="60" y="148.05" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">raw feed reaches each column downstream.</text><rect id="box-n0" x="60" y="189.25" width="520" height="64" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><text id="t-n0-4" x="80" y="230.25" font-family="'DejaVu Sans Mono', monospace" font-size="22" font-weight="600" fill="#14182E" text-anchor="start" xml:space="preserve">raw.trades.notional_amt</text><rect id="r5" x="620" y="201.25" width="560.0" height="40" rx="6" fill="#D9534F" stroke="none" stroke-width="2"/><text id="t6" x="1200" y="230.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">100% · the defect</text><rect id="box-n1" x="60" y="273.25" width="520" height="64" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><text id="t-n1-7" x="80" y="314.25" font-family="'DejaVu Sans Mono', monospace" font-size="22" font-weight="600" fill="#14182E" text-anchor="start" xml:space="preserve">stg.trades.notional</text><rect id="r8" x="620" y="285.25" width="560.0" height="40" rx="6" fill="#2B3FA8" stroke="none" stroke-width="2"/><text id="t9" x="1200" y="314.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">100% · copied</text><line id="a10" x1="320" y1="253.25" x2="320" y2="269.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-n2" x="60" y="357.25" width="520" height="64" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><text id="t-n2-11" x="80" y="398.25" font-family="'DejaVu Sans Mono', monospace" font-size="22" font-weight="600" fill="#14182E" text-anchor="start" xml:space="preserve">mart.positions.exposure_usd</text><rect id="r12" x="620" y="369.25" width="196.0" height="40" rx="6" fill="#2B3FA8" stroke="none" stroke-width="2"/><text id="t13" x="836.0" y="398.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">35% · summed with FX</text><line id="a14" x1="320" y1="337.25" x2="320" y2="353.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-n3" x="60" y="441.25" width="520" height="64" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><text id="t-n3-15" x="80" y="482.25" font-family="'DejaVu Sans Mono', monospace" font-size="22" font-weight="600" fill="#14182E" text-anchor="start" xml:space="preserve">Dashboard: Exposure</text><rect id="r16" x="620" y="453.25" width="196.0" height="40" rx="6" fill="#2B3FA8" stroke="none" stroke-width="2"/><text id="t17" x="836.0" y="482.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">35% · renamed</text><line id="a18" x1="320" y1="421.25" x2="320" y2="437.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-n4" x="60" y="525.25" width="520" height="64" rx="14" fill="#FFFFFF" stroke="#D6DAE6" stroke-width="2"/><text id="t-n4-19" x="80" y="566.25" font-family="'DejaVu Sans Mono', monospace" font-size="22" font-weight="600" fill="#14182E" text-anchor="start" xml:space="preserve">Dashboard: Total Exposure</text><rect id="r20" x="620" y="537.25" width="67.2" height="40" rx="6" fill="#2B3FA8" stroke="none" stroke-width="2"/><text id="t21" x="707.2" y="566.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#5A6480" text-anchor="start" xml:space="preserve">12% · aggregated again</text><line id="a22" x1="320" y1="505.25" x2="320" y2="521.25" stroke="#5A6480" stroke-width="3" marker-end="url(#head)"/><rect id="box-limit" x="60" y="623.25" width="1280" height="112" rx="14" fill="#F3F5FA" stroke="#D6DAE6" stroke-width="2"/><text id="t-limit-23" x="84" y="660.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">What it cannot see: four trades with currency &#x27;usd&#x27; drop out of the mart at the FX join. A join key is</text><text id="t-limit-24" x="84" y="688.6" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">not a value, so the blast radius stops at staging, while 605,000,000 of notional silently leaves the</text><text id="t-limit-25" x="84" y="716.95" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#14182E" text-anchor="start" xml:space="preserve">exposure. The control on the raw column is what catches it.</text></svg>