# Prama — project definition.
# Copyright (c) 2026 Ashutosh Sinha <ajsinha@gmail.com>. All rights reserved.
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prama"
description = "Prama — a business-owned, evidence-first data quality control plane."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — see LICENSE" }
authors = [{ name = "Ashutosh Sinha", email = "ajsinha@gmail.com" }]
dynamic = ["version"]
dependencies = [
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0.30",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyarrow>=17",
    "duckdb>=1.1",
    # The console: server-rendered Jinja, session cookies signed by
    # itsdangerous. Not optional, because a control plane whose users are
    # business owners is not usefully deployable headless.
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    # The help centre renders the design corpus and the console guides from
    # their Markdown sources, so the help and the documents cannot disagree.
    "markdown>=3.6",
    # Lineage: a real SQL parser, about twenty dialects, pure Python, MIT. The
    # regex extractor stays only as the fallback for what it cannot parse,
    # reported as a gap (docs/23, Wave 12; owner-approved 2026-09-27).
    "sqlglot>=25",
    # The deterministic code the server shares with remote agents (kernel/).
    "prama-kernel",
]

[project.optional-dependencies]
serve = ["uvicorn[standard]>=0.30"]
postgres = ["asyncpg>=0.29", "psycopg[binary]>=3.1"]
fast = ["orjson>=3.10"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    # The SDK is its own package (sdk/), installed from the checkout so the
    # server's tests drive the real client, and the server never imports it.
    "prama-sdk",
    # The agent daemon is its own package (agent/), installed from the checkout
    # so the server's tests run the real agent against the server's own
    # assignments. The server never imports it.
    "prama-agent",
]
# The accessibility audit. Separate from `dev` because it is the one dependency
# that needs a browser: playwright drives the Chrome already installed rather
# than downloading its own, so this adds a package and not 150MB — but a clone
# without it should skip the audit loudly rather than fail to install.
audit = ["playwright>=1.44"]
# The deck generator (tools/deck). Separate because only somebody rebuilding
# the presentation needs it; the deck tests skip without it.
deck = ["python-pptx>=1.0"]
# OpenTelemetry export of Prama's own spans (observability.tracing.exporter: otlp).
# Optional: without it tracing is off, and asking for otlp refuses to start.
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
# Single sign-on. Separate because most deployments start with local accounts,
# and because this is the one place a wrong dependency choice is a security
# decision rather than a packaging one: verifying an ID token's RS256 signature
# needs real RSA, and hand-rolling the PKCS#1 v1.5 padding check is how forged
# signatures get accepted. A clone without this extra refuses SSO loudly rather
# than falling back to something weaker.
sso = ["cryptography>=43"]
# The Kafka transport. Separate because the broker client is a compiled
# dependency and most deployments validate in batch before they validate in
# flight — and because prama.execute.transport must stay importable without it,
# which is what lets the commit ordering be tested with no broker at all.
kafka = ["confluent-kafka>=2.5"]
# The REST connector. httpx is already a dev dependency for the test client and
# is what prama.llm.providers uses; this makes it a runtime one for deployments
# that read an API.
rest = ["httpx>=0.27"]
# Any JDBC-reachable database. Needs a Java runtime on the host as well as these
# packages, and the driver jar is supplied by the deployment — Prama does not
# redistribute an Oracle or DB2 driver and will not fetch one.
jdbc = ["JayDeBeApi>=1.2", "JPype1>=1.5"]
# Snowflake. NOT YET VERIFIED against a real account — see the module docstring
# in prama/connect/sources/sql/snowflake.py, which says so and is asserted by a
# test so it cannot quietly become a claim.
snowflake = ["snowflake-connector-python>=3.12"]
# ClickHouse, over its HTTP interface. Verified against ClickHouse 24.8.
clickhouse = ["clickhouse-connect>=0.8"]
# MongoDB. Verified against MongoDB 7.
mongo = ["motor>=3.6", "pymongo>=4.9"]

[project.scripts]
prama = "prama.cli.main:main"

[tool.uv.sources]
prama-sdk = { path = "sdk", editable = true }
prama-kernel = { path = "kernel", editable = true }
prama-agent = { path = "agent", editable = true }

[tool.setuptools.dynamic]
version = { attr = "prama.version.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The console's templates and vendored assets are part of the package, not
# build output. Without this an installed wheel serves an application whose
# every page 500s on a missing template — and it passes every test run from a
# source checkout, where the files are simply there.
"prama.report" = [
    "templates/*.html",
    "templates/*.css",
]
"prama.web" = [
    "guides/*.md",
    "content/*.yaml",
    "templates/*.html",
    "templates/**/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/img/*.svg",
    "static/vendor/**/*",
]

[tool.pytest.ini_options]
# `tests` is the suite written alongside the code. `qa/regression-suite` is
# the one derived from QA findings — every entry a defect that was observed to
# fail before it was fixed. Both are gates, so both are collected; a regression
# suite nobody runs is a directory, not a guard. The raw QA harnesses in
# `qa/harness` are deliberately NOT here: they print rather than assert, and
# collecting them would add thousands of tests that pass unconditionally.
testpaths = ["tests", "qa/regression-suite"]
# Without this, two test files sharing a basename in different directories
# collide on import and the whole run aborts during collection — not with a
# failure, with an *error*, which is easy to miss if the output is piped. It
# happened twice (tests/db/test_semantic.py, tests/evidence/test_end_to_end.py)
# before the cause was fixed rather than the instance. importlib mode gives
# each file its own module identity, so a name can repeat where repeating it
# is the clearest name.
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:prama.*"]
markers = [
    "postgres: requires a reachable PostgreSQL instance",
    # Kept as a marker so they can be selected — `pytest -m casestudy` — but
    # NOT excluded from the default run. Measured at ~2.5s each, and they are
    # the product's own demonstration that it works. QA found all four dead on
    # committed code because nothing under tests/ exercised them; ten seconds
    # is a cheap price for never repeating that.
    "casestudy: runs a case study end to end",
    # QA regression cases whose cost is measured in tens of seconds — trust
    # propagation over a wide lineage graph, conformal calibration over 100k
    # points. Marked so `-m "not slow"` stays quick during a fix cycle; the
    # full gate runs them, because the defects they guard were performance
    # defects and a performance guard that is always skipped guards nothing.
    "slow: takes seconds rather than milliseconds",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# Sample application code that intake reads as *input*, written in the style
# of the third-party code it imitates (PySpark's `functions as F`). Linting it
# as Prama's own would mean rewriting the fixture into something no bank runs.
extend-exclude = ["tests/fixtures/code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "RUF059", "SLF001"]
# TypeDecorator hooks take a `dialect` argument the base class imposes; the
# portable types genuinely do not branch on it, which is the whole point.
"src/prama/db/types.py" = ["ARG002"]
# FastAPI idioms, both load-bearing:
#   B008  Query()/Depends() in a default IS the framework's declaration syntax.
#   ARG001 a `caller` a handler does not read still validates the tenant header
#          and sets the logging context; removing it would remove that check.
"src/prama/api/routes/*.py" = ["B008", "ARG001"]

[tool.mypy]
python_version = "3.11"
packages = ["prama"]
mypy_path = "src:kernel/src:sdk/src:agent/src"
strict = true
warn_unreachable = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["yaml", "orjson", "pyarrow", "pyarrow.*", "duckdb", "markdown", "sqlglot", "sqlglot.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/prama"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# The JDBC bridge ships no type information. It is an optional extra reached
# through one function, so the untyped surface is small and contained.
[[tool.mypy.overrides]]
module = ["jaydebeapi.*", "jpype.*"]
ignore_missing_imports = true

# The Snowflake driver is an optional extra and is not installed here.
[[tool.mypy.overrides]]
module = ["snowflake.*"]
ignore_missing_imports = true
