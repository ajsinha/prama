# Prama — tracked configuration.
# Copyright (c) 2026 Ashutosh Sinha <ajsinha@gmail.com>. All rights reserved.
#
# THIS FILE IS TRACKED IN GIT. A secret written here is a public secret.
# Real secrets belong in config/application.local.yaml, which is git-ignored and
# is loaded automatically straight after this file. Alternatively use
# ${ENV_VAR:default} substitution, or a PRAMA_-prefixed environment variable.
#
# Precedence, weakest to strongest:
#   built-in defaults  ->  this file  ->  application.local.yaml  ->  PRAMA_* env  ->  --set
#
# Inspect the effective, merged, redacted result with:  prama config show

app:
  name: Prama
  environment: development          # development | test | staging | production
  instance_id: ${HOSTNAME:local}

logging:
  level: INFO                       # DEBUG | INFO | WARNING | ERROR
  format: text                      # text (terminal) | json (log shipper)

security:
  # Deliberately empty. Prama refuses to serve without it, so that a fresh
  # clone can never run on a value that is in a public repository.
  session_secret: ""
  cookies_https_only: true          # false only for local http development

tenancy:
  # Name the single tenant here and the console needs no sign-in to read.
  # Empty means multi-tenant: an unauthenticated request is refused, not guessed.
  default_tenant: ""

server:
  host: 127.0.0.1                    # bind address; 0.0.0.0 accepts on every interface
  port: 5900                        # the console and the API share this listener

agents:
  # Steward agents: persistent AI agents that read, think through the model
  # gateway, and propose. Created on the Agents page; they never approve.
  enabled: true
  interval: 60s                     # how often due goals are checked

delegates:
  # DQ delegates: Python checks a control names with USING DELEGATE '<name>'.
  # Each host (this server, every remote agent) runs only what its own copy
  # of this section admits. See docs/design/dq-delegates.md.
  enabled: true
  paths: []                         # directories of delegate .py files, vetted before import
  entry_points: true                # also load the prama.delegates entry point
  disabled: []                      # names to refuse even if installed
  sandbox: true                     # run in a resource-limited subprocess
  timeout: 120                      # CPU seconds per run
  memory_mb: 2048
  max_rows: 5000000                 # a larger dataset is refused, never truncated

codeintake:
  # Application code received as a ZIP or fetched from git. Never executed.
  workdir: data/code                # extracted here while read; deleted after
  timeout: 300                      # seconds the sandboxed reader may take
  git:
    allowed_hosts: []               # empty: any public host; or e.g. [git.bank.example]

scheduler:
  # Runs due controls inside `prama serve`, one server per tick (a database
  # lease). Off by default; turning it on needs a source and a default tenant.
  enabled: false
  interval: 60s
  against: ""                       # a local .duckdb or .sqlite file
  dialect: duckdb                   # duckdb | sqlite

llm:
  # Providers and profiles live in the database (Models page, `prama llm`).
  offline: false                    # true: only self-hosted models on a local or private address
  per_principal_rpm: 60             # requests per minute per principal through /api/v1/llm

web:
  enabled: true                     # serve the console alongside the API

  preview:
    # Where the control studio runs a preview or a backtest. Empty means the
    # studio can check and compile a control but cannot run one, and it says so
    # on the screen rather than showing an empty result that reads as clean.
    #
    # A preview writes nothing to the evidence ledger. It runs an unapproved
    # control, often against a bounded scan, and evidence a regulator may read
    # must be the record of a control the estate agreed to, run in full.
    source: ""                      # a local .duckdb or .sqlite file
    dialect: duckdb                 # duckdb | sqlite
    # A scan ceiling, so a preview against a billion-row table cannot be the
    # thing that takes the warehouse down. Applied by wrapping the source, so
    # it bounds the scan and not just the row of results. Zero is unbounded.
    max_rows: 1000000
    # How many business days a backtest covers by default.
    backtest_days: 30

database:
  # The only switch that chooses a database. No code branches on this value
  # outside prama/db/dialects.py, and there are no migrations: schema/sqlite.sql
  # and schema/postgres.sql are the authority for their respective engines.
  dialect: sqlite                   # sqlite | postgres

  sqlite:
    path: data/prama.db             # ":memory:" is honoured, for tests
    journal_mode: WAL               # WAL lets readers proceed during a write
    synchronous: NORMAL
    busy_timeout: 5s
    foreign_keys: true

  postgres:
    host: ${PGHOST:localhost}
    port: ${PGPORT:5432}
    database: ${PGDATABASE:prama}
    user: ${PGUSER:prama}
    password: ""                    # -> application.local.yaml, or PGPASSWORD
    sslmode: prefer
    application_name: prama
    schema: public
    statement_timeout: 60s

  pool:
    size: 10
    max_overflow: 20
    timeout: 30s
    recycle: 30m
    pre_ping: true                  # costs one round trip; prevents stale-connection storms

  schema_dir: schema
  verify_on_start: true             # fail loudly on schema drift rather than migrate
  echo: false

concurrency:
  supervisor:
    shutdown_grace: 30s
  lease:
    provider: database              # database | memory
    ttl: 30s
    renew_interval: 10s
    clock_skew_allowance: 2s

plugins:
  entry_point_groups:
    - prama.connectors
    - prama.backends
    - prama.monitors
    - prama.notifiers
    - prama.scorers
    - prama.validators
  disabled: []
