# The gate, run by something other than the person who wrote the change.
#
# Six documents asserted that these rules were "enforced by hooks, by
# architecture tests, and by CI" while no CI existed — finding H2 of
# docs/reviews/2026-09-11-adversarial-review.md. A pre-commit hook is enforcement
# only for somebody who installed it, and `scripts/gate.sh` is enforcement only
# for somebody who remembered to run it. Both are easy to skip and neither
# leaves a record.
#
# Everything here calls scripts/gate.sh rather than restating its steps. A
# second list of checks is a second thing to keep in step, and it drifts in the
# flattering direction.

name: gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint, types, file length, docs, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The interpreter is pinned in .python-version and built from a
      # standalone CPython, not from the runner's system Python. The reason is
      # in CLAUDE.md: an interpreter the package manager owns is one the package
      # manager can delete, and it did.
      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: build the environment
        run: |
          uv python install "$(cat .python-version)"
          uv venv --python "$(cat .python-version)"
          uv pip install -e ".[dev]"

      - name: run the gate
        run: |
          source .venv/bin/activate
          ./scripts/gate.sh

  conformance:
    name: three engines, not two
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PostgreSQL is a service rather than a skip. The IR conformance suite's
    # whole claim is that one control means the same thing on every engine, and
    # a run that silently drops to DuckDB and SQLite proves less than it looks
    # — which is finding T7, in the place T7 was about.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prama
          POSTGRES_PASSWORD: prama
          POSTGRES_DB: prama
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prama"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: build the environment
        run: |
          uv python install "$(cat .python-version)"
          uv venv --python "$(cat .python-version)"
          uv pip install -e ".[dev,postgres]"

      - name: conformance on three engines
        env:
          PRAMA_TEST_POSTGRES_DSN: postgresql://prama:prama@127.0.0.1:5432/prama
        run: |
          source .venv/bin/activate
          pytest -q tests/backend tests/db tests/pql

  accessibility:
    name: axe-core in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: build the environment
        run: |
          uv python install "$(cat .python-version)"
          uv venv --python "$(cat .python-version)"
          uv pip install -e ".[dev,audit]"
          source .venv/bin/activate
          playwright install --with-deps chromium

      # docs/19 said "the accessibility guarantee is held by axe-core in CI"
      # on one page and listed "running it in CI, which needs a browser on the
      # runner" under Not done on another. This is the half that was missing.
      - name: axe-core
        run: |
          source .venv/bin/activate
          pytest -q tests/web/test_axe.py
