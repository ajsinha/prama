# The competitive landscape, as content: /about/competitive renders it.
#
# Categories, not vendors, and every rating is about what is BUILT, not planned.
# Ratings are exactly Yes, Partial or No; prama.web.about refuses anything else.
# Kept as data rather than Python because it is copy about products, and the
# layering guard rightly refuses a module that both names models and verdicts.
# docs/corpus/20-competitive-analysis.md is the vendor-by-vendor long form.
#
