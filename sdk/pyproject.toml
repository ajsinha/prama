# prama-sdk — the Python client of a Prama server, packaged on its own.
# Copyright (c) 2026 Ashutosh Sinha <ajsinha@gmail.com>. All rights reserved.
#
# Deliberately separate from the server's package: a client machine installs
# this and nothing of the server. It never imports `prama`, and the server's
# tests (tests/architecture/test_sdk_standalone.py) fail the build if it does,
# or if its wheel carries anything but prama_sdk and these dependencies.
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prama-sdk"
description = "The Python SDK for Prama: everything a Prama server does, from Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — see LICENSE" }
authors = [{ name = "Ashutosh Sinha", email = "ajsinha@gmail.com" }]
dynamic = ["version"]
dependencies = [
    "httpx>=0.27",
    # Only to read server.host and server.port from the server's application.yaml.
    "PyYAML>=6.0",
]

[project.urls]
Documentation = "https://github.com/ajsinha/prama/tree/main/docs/sdk"

[tool.setuptools.dynamic]
version = { attr = "prama_sdk.version.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
