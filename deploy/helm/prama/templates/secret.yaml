{{- if and .Values.createSecretFrom (not .Values.existingSecret) }}
# Only when a literal was passed deliberately. There is no generated fallback:
# a chart that invents a secret produces an installation whose sessions are
# forgeable by anyone who can read the release, and nothing about it looks
# wrong.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-session" (include "prama.fullname" .) }}
  labels: {{- include "prama.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ .Values.createSecretFrom | quote }}
{{- end }}
