apiVersion: v1
kind: Service
metadata:
  name: {{ include "prama.fullname" . }}
  labels: {{- include "prama.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "prama.selectorLabels" . | nindent 4 }}
